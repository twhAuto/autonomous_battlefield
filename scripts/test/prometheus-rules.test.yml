# promtool unit tests for the SLI recording rules in the local Prometheus overlay.

rule_files:
  - ../../deploy/overlays/local/observability/prometheus/alerts.yml

evaluation_interval: 30s

tests:
  # A healthy API has no 5xx series at all; the SLI must read 1, not "no data".
  - interval: 1m
    input_series:
      - series: 'battlefield_http_server_requests_total{component="api",code="200"}'
        values: '0+60x10'
    promql_expr_test:
      - expr: battlefield:api_availability:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'battlefield:api_availability:ratio_rate5m'
            value: 1

  # One request in a hundred fails with a 5xx.
  - interval: 1m
    input_series:
      - series: 'battlefield_http_server_requests_total{component="api",code="200"}'
        values: '0+99x10'
      - series: 'battlefield_http_server_requests_total{component="api",code="503"}'
        values: '0+1x10'
    promql_expr_test:
      - expr: battlefield:api_availability:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'battlefield:api_availability:ratio_rate5m'
            value: 0.99
