openapi: 3.1.0
info:
  title: OrdinalFrontier API
  version: 1.0.0
  summary: Public /v1 API for factions, battles, background generation, and administration.
  description: |
    Machine-readable contract for the public `/v1` API: every route, request body,
    response shape, error code, and battle state and event payload. The prose guide
    in [api.md](./api.md) owns behavior a schema cannot express, such as
    permissions, retries, admission limits and battlefield visibility.

    **Scope.** Every `/v1` route the API serves is listed here. The process probes
    (`/startupz`, `/livez`, `/healthz`, `/readyz`) and `/metrics` are infrastructure
    endpoints outside this contract, as is the internal worker plane served by the
    separate `cmd/aigateway` binary.

    **Drift protection.** `backend/test/apicontract` fails the build if the set of
    operations here differs from `authn.PublicAPIRoutes()`, the permission registry
    that `RoutePolicy` enforces. Add a route to both, or neither.

    **Request bodies.** The server decodes JSON strictly: one value per body, at most
    64 KiB, and unknown fields are rejected. Every request schema therefore sets
    `additionalProperties: false`.

    **Errors.** Every error uses the `ErrorEnvelope` schema. Branch on `error.code`,
    which is stable; `error.message` is human-readable and may change. Unregistered
    `/v1` routes, and registered paths called with an unregistered method, return
    `403 permission_denied` rather than `404`, so responses do not reveal whether a
    route exists.

    **Idempotency.** Retries are safe through client-generated identifiers and
    state-based controls, documented on their operations:
    `POST /v1/faction-background-generations` replays a repeated `idempotencyKey`;
    `POST /v1/battles` and `POST /v1/factions` replay a retry that reuses the `id`
    with the same caller and parameters (a mismatched reuse returns
    `409 already_exists`); and repeating `stop`, `pause`, or `resume` on a battle
    already in that state succeeds. There is no generic `Idempotency-Key` header.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /
    description: |
      The API is served on the same origin as the web application. Locally that is
      `http://localhost:8080`.

security:
  - cloudflareAccess: []
  - sessionCookie: []

tags:
  - name: Authentication
    description: Session discovery, and sign-in for the local administrator account.
  - name: Factions
    description: Faction profiles that battles snapshot when they are queued.
  - name: Battles
    description: Queueing, observing, and controlling battles, and reading their history.
  - name: Leagues
    description: Admin-run AI tournaments whose fixtures the API plays as background battles.
  - name: Analytics
    description: Summaries of completed battles by controller, faction, unit, upgrade and map.
  - name: Catalog
    description: Read-only scenario, ruleset, and AI controller profile data.
  - name: Background generation
    description: AI-drafted faction backgrounds, subject to a per-actor allowance.
  - name: Administration
    description: Admin-only model access policy and managed Player membership.

paths:
  /v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Describe the current session and authentication mode
      security: []
      description: |
        Always reachable without credentials so clients can learn the authentication
        mode. An unauthenticated caller receives `401` with a **session** body, not an
        error envelope.
      responses:
        '200':
          description: Authenticated session.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example:
                enabled: true
                authenticated: true
                mode: cloudflare
                actor: {id: 3f2a…, email: friend@example.com, role: player}
                capabilities: {inspect: false, admin: false, members: false}
        '401':
          description: Not authenticated. The body is a session, not an error.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example: {enabled: true, authenticated: false, mode: local-password}

  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in with the local administrator account
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      security: []
      description: |
        Local mode only. In Cloudflare mode Access owns sign-in and this route returns
        `404 not_found`. Wrong usernames and wrong passwords produce identical
        responses so the endpoint cannot be used to discover valid usernames.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {username: admin, password: '...'}
      responses:
        '204':
          description: Signed in. Sets an HttpOnly, SameSite=Strict session cookie.
          headers:
            Set-Cookie:
              description: The `battlefield_session` cookie.
              schema: {type: string}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}

  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the session
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      security: []
      responses:
        '200':
          description: Cloudflare mode. Navigate the browser to `logoutUrl`.
          content:
            application/json:
              schema:
                type: object
                required: [logoutUrl]
                properties:
                  logoutUrl: {type: string, const: /cdn-cgi/access/logout}
        '204':
          description: Local mode. The session cookie is cleared.
        '405': {$ref: '#/components/responses/MethodNotAllowed'}

  /v1/factions:
    get:
      tags: [Factions]
      operationId: listFactions
      summary: List factions in stable creation order
      responses:
        '200':
          description: All factions.
          content:
            application/json:
              schema:
                type: object
                required: [factions]
                properties:
                  factions:
                    type: array
                    items: {$ref: '#/components/schemas/Faction'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}
    post:
      tags: [Factions]
      operationId: createFaction
      summary: Create a faction
      description: |
        **Idempotency:** the client supplies the faction `id`, which makes retries
        safe. Repeating the request with the same `id`, caller, and trimmed name,
        doctrine, and background returns `201` again without another write. Reusing
        the `id` with a different caller or content returns `409 already_exists`.
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFactionRequest'}
            example:
              id: 4db8d152-1e04-4d10-8824-859c6ed72878
              name: Northern Alliance
              doctrine: Protect income, scout before committing, and adapt purchases to visible threats.
              background: Descendants of the northern watch, sworn to shelter displaced families.
      responses:
        '201':
          description: Created. The response has no body.
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/AlreadyExists'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/factions/{id}:
    parameters:
      - {$ref: '#/components/parameters/FactionId'}
    put:
      tags: [Factions]
      operationId: updateFaction
      summary: Update a faction's profile
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: Changes apply only to future battles. Requires ownership or Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateFactionRequest'}
            example: {name: Northern Alliance, doctrine: Protect income.}
      responses:
        '204':
          description: Updated.
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/Internal'}
    delete:
      tags: [Factions]
      operationId: deleteFaction
      summary: Delete a faction
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Removes the faction from the active registry. Battle history remains readable
        because each battle stores an immutable snapshot. Requires ownership or Admin.
      responses:
        '204':
          description: Deleted.
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/faction-rulesets:
    get:
      tags: [Catalog]
      operationId: listFactionRulesets
      summary: List ruleset catalog data
      description: Starting gold, unit statistics, upgrades, structures, and costs.
      responses:
        '200':
          description: Rulesets.
          content:
            application/json:
              schema:
                type: object
                required: [rulesets]
                properties:
                  rulesets:
                    type: array
                    items: {$ref: '#/components/schemas/Ruleset'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}

  /v1/scenarios:
    get:
      tags: [Catalog]
      operationId: listScenarios
      summary: List authored battle scenarios
      responses:
        '200':
          description: Scenarios.
          content:
            application/json:
              schema:
                type: object
                required: [scenarios]
                properties:
                  scenarios:
                    type: array
                    items: {$ref: '#/components/schemas/ScenarioSummary'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}

  /v1/model-profiles:
    get:
      tags: [Catalog]
      operationId: listModelProfiles
      summary: List AI controller profiles the caller may use
      description: |
        Never returns credential values or credential environment-variable names.
        Players see only available profiles they are approved for, with a reduced set
        of fields.
      responses:
        '200':
          description: Profiles visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: {$ref: '#/components/schemas/ModelProfile'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}

  /v1/battles:
    get:
      tags: [Battles]
      operationId: listBattles
      summary: Browse battle history
      description: |
        Ordered by creation time descending, then ID descending. Newer insertions do
        not shift later pages; restart without a cursor to see them.
      parameters:
        - name: status
          in: query
          description: Omit for all battles. `paused` means an active battle with its pause flag set.
          schema: {type: string, enum: [queued, running, paused, completed, failed, stopped]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: cursor
          in: query
          description: Opaque `nextCursor` from a previous page with the same filter.
          schema: {type: string}
      responses:
        '200':
          description: One page of battle summaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BattleHistoryPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}
    post:
      tags: [Battles]
      operationId: createBattle
      summary: Queue a battle
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Both factions must exist. The API snapshots faction names, backgrounds and
        doctrines, the map, ruleset, and controller plans.

        **Idempotency:** the client supplies the battle `id`, which makes retries safe.
        Repeating a request with the same `id` returns `202` and the **existing**
        battle when the caller, the resolved scenario, and `tickCount` all match the
        original, so a retried request never queues a second battle. The `status` in
        that response is the existing battle's current status, not necessarily
        `queued`. Reusing an `id` with a different caller, scenario, or `tickCount`
        returns `409 already_exists`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBattleRequest'}
            example:
              id: 7f22e693-bacd-46bb-b942-64fa613cd388
              scenarioId: castle-siege
              participants:
                - factionId: 4db8d152-1e04-4d10-8824-859c6ed72878
                  controller: {type: model, profileId: gemini-api-balanced}
                - factionId: 41ac3a2f-3371-4de1-b0f6-70600fcd9052
                  controller: {type: scripted}
              tickCount: 100
      responses:
        '202':
          description: Queued, or the existing battle for a matching retry.
          headers:
            Location:
              description: '`/v1/battles/{id}` for the new battle.'
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string, format: uuid}
                  status: {$ref: '#/components/schemas/BattleStatus'}
              example: {id: 7f22e693-bacd-46bb-b942-64fa613cd388, status: queued}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AlreadyExists'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/allowance:
    get:
      tags: [Battles]
      operationId: getBattleAllowance
      summary: Get the caller's battle allowance
      description: |
        Reports the counts and limits `POST /v1/battles` admits against, for the
        caller's role. The values can change before the next battle is created, so a
        start can still return `429`.
      responses:
        '200':
          description: The allowance when it was read.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BattleAllowance'}
              example:
                limited: true
                startedToday: 2
                dailyLimit: 5
                unfinished: 0
                unfinishedLimit: 1
                serviceUnfinished: 3
                serviceUnfinishedLimit: 4
                resetAt: '2026-11-03T00:00:00Z'
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/{id}:
    parameters:
      - {$ref: '#/components/parameters/BattleId'}
    get:
      tags: [Battles]
      operationId: getBattle
      summary: Get battle status, map, state, and results
      responses:
        '200':
          description: The battle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Battle'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/{id}/stop:
    parameters:
      - {$ref: '#/components/parameters/BattleId'}
    post:
      tags: [Battles]
      operationId: stopBattle
      summary: Stop a queued or running battle
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Releases the engine lease and marks unresolved model decisions as failed.
        Requires ownership or Admin. Repeating the call on an already stopped battle
        returns `200` with the current battle, so a retried stop is safe. A battle
        that completed or failed returns `409 conflict`.
      responses:
        '200': {$ref: '#/components/responses/BattleResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/{id}/pause:
    parameters:
      - {$ref: '#/components/parameters/BattleId'}
    post:
      tags: [Battles]
      operationId: pauseBattle
      summary: Pause an active battle
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Preserves the current attempt. Requires ownership or Admin. Pausing an
        already paused active battle returns `200` unchanged. A completed, failed,
        or stopped battle returns `409 conflict`.
      responses:
        '200': {$ref: '#/components/responses/BattleResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/{id}/resume:
    parameters:
      - {$ref: '#/components/parameters/BattleId'}
    post:
      tags: [Battles]
      operationId: resumeBattle
      summary: Resume a paused battle
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Requires ownership or Admin. Resuming an active battle that is not paused
        returns `200` unchanged. A completed, failed, or stopped battle returns
        `409 conflict`.
      responses:
        '200': {$ref: '#/components/responses/BattleResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/BattleId'}
    get:
      tags: [Battles]
      operationId: listBattleEvents
      summary: Page through battle events
      parameters:
        - name: attempt
          in: query
          description: Defaults to the battle's current attempt.
          schema: {type: integer, minimum: 1}
        - name: after
          in: query
          description: The last event sequence already observed.
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: latest
          in: query
          description: |
            When true, returns the most recent `limit` events of the attempt, still
            ordered by ascending sequence. Cannot be combined with a nonzero `after`
            (`400`).
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Events ordered by sequence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BattleEventPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/{id}/replay:
    parameters:
      - {$ref: '#/components/parameters/BattleId'}
    get:
      tags: [Battles]
      operationId: getBattleReplay
      summary: Replay a finished battle segment
      description: |
        Returns the segment of a completed, stopped or failed battle's final attempt
        that contains `tick`. The engine stores a checkpoint at the opening and at
        every decision window; the API resumes the engine from the checkpoint at or
        before `tick` and re-simulates the ticks before the next window, so a segment
        spans at most one decision interval. Request `nextTick` to continue. Players
        receive event `data` as an empty object, as on the events route.
      parameters:
        - name: tick
          in: query
          description: Any tick from 0 to the battle's final tick (`400` beyond it).
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: One replay segment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BattleReplay'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: |
            `conflict`: the battle is still queued or running, or its final attempt
            saved no checkpoint for the segment, such as a battle that finished before
            replays were recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/{id}/decisions:
    parameters:
      - {$ref: '#/components/parameters/BattleId'}
    get:
      tags: [Battles]
      operationId: listBattleDecisions
      summary: List AI decision history for an attempt
      description: Players receive the reduced `DecisionHistory` shape.
      parameters:
        - name: attempt
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Decisions.
          content:
            application/json:
              schema:
                type: object
                required: [decisions]
                properties:
                  decisions:
                    type: array
                    items: {$ref: '#/components/schemas/DecisionHistory'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/{id}/decisions/{requestId}/context:
    parameters:
      - {$ref: '#/components/parameters/BattleId'}
      - name: requestId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Battles]
      operationId: getDecisionContext
      summary: Get the saved observation for one decision
      description: |
        Requires the Tester or Admin role. A request belonging to another battle or
        attempt returns `404`. Provider metadata, trace state, submission capabilities,
        and credentials are excluded.
      parameters:
        - name: attempt
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: The saved decision context.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedDecisionContext'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/battles/{id}/factions/{factionId}/view:
    parameters:
      - {$ref: '#/components/parameters/BattleId'}
      - name: factionId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Battles]
      operationId: getFactionView
      summary: Get the open battlefield and one faction's economic totals
      description: |
        All terrain, entities, routes and actions are present. Opponents' aggregate
        gold, upgrades and production totals are omitted, as are their per-building
        production selections, on/off settings and gold-wait status. Paid training
        progress remains visible.
      responses:
        '200':
          description: The faction-visible battlefield.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BattleView'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '501': {$ref: '#/components/responses/NotImplemented'}

  /v1/faction-background-generations/options:
    get:
      tags: [Background generation]
      operationId: getGenerationOptions
      summary: Get the caller's generation availability and allowance
      responses:
        '200':
          description: Availability.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationOptions'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/faction-background-generations:
    post:
      tags: [Background generation]
      operationId: createGeneration
      summary: Queue a background generation job
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Allows 10 requests per actor per UTC day, at least 30 seconds apart, and one
        queued or running job.

        **Idempotency:** a repeated `idempotencyKey` with the same normalized input
        returns the original job without another charge. The same key with different
        input returns `409 conflict`. Validation failures (`400`) and unavailable
        profiles (`503`) do not reserve quota.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGenerationRequest'}
            example:
              name: Northwind
              doctrine: Protect income.
              background: Optional inspiration
              idempotencyKey: 6f1c2d8e-client-generated
      responses:
        '202':
          description: Queued, or the original job for a replayed key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationJob'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429':
          description: |
            Allowance exhausted or another job is active. The body carries the
            availability fields clients use for the cooldown **and** the error envelope.
          headers:
            Retry-After:
              description: Seconds until another request may be admitted.
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/GenerationOptions'}
                  - {$ref: '#/components/schemas/ErrorEnvelope'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/faction-background-generations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Background generation]
      operationId: getGeneration
      summary: Get one of the caller's generation jobs
      description: Another actor's job identifier returns `404`.
      responses:
        '200':
          description: The job.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationJob'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/leagues:
    get:
      tags: [Leagues]
      operationId: listLeagues
      summary: List leagues, newest first
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: League summaries, and the capacity league battles run in.
          content:
            application/json:
              schema:
                type: object
                required: [leagues, scheduling]
                properties:
                  leagues:
                    type: array
                    items: {$ref: '#/components/schemas/LeagueSummary'}
                  scheduling:
                    type: object
                    additionalProperties: false
                    required: [battleSlots, cliSlots]
                    properties:
                      battleSlots:
                        description: Battles the engine runs at once (`engine.concurrency`).
                        type: integer
                        minimum: 1
                      cliSlots:
                        description: CLI model executions allowed at once (`runtime_policy.cli_concurrency`), shared by the CLI model sides of league battles.
                        type: integer
                        minimum: 1
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}
    post:
      tags: [Leagues]
      operationId: createLeague
      summary: Create and start a league
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Admins only. 8 entrants form groups A and B; 16 form groups A to D, four per
        group, each with a distinct faction. Every entrant is checked on every map
        with the same rules as battle creation, including model access and timing.
        The API then plays the fixtures in the background: each group plays a dual
        tournament, then the top two per group meet in a crossover knockout, every
        match one battle. League battles are owned by the creating Admin, skip
        the battle allowances and the per-battle model decision budget, and keep the
        one-hour battle timeout.

        **Idempotency:** repeating the same request with the same `id` returns `201`
        and the existing league; reusing the `id` for a different request returns
        `409 already_exists`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLeagueRequest'}
      responses:
        '201':
          description: The league, or the existing league for a matching retry.
          headers:
            Location:
              description: '`/v1/leagues/{id}` for the league.'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/League'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AlreadyExists'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/leagues/{id}:
    parameters:
      - {$ref: '#/components/parameters/LeagueId'}
    get:
      tags: [Leagues]
      operationId: getLeague
      summary: Read a league with its tables, knockout and fixtures
      responses:
        '200':
          description: The league.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/League'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/leagues/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/LeagueId'}
    post:
      tags: [Leagues]
      operationId: cancelLeague
      summary: Cancel a running league
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Admins only. Cancels every unfinished fixture and stops the running battle.
        Repeating the call on a cancelled league returns `200` with the league and
        stops any league battle still running; a completed league returns
        `409 conflict`.
      responses:
        '200':
          description: The cancelled league.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/League'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/leagues/{id}/entrants/{entrant}/disqualify:
    parameters:
      - {$ref: '#/components/parameters/LeagueId'}
      - name: entrant
        in: path
        required: true
        description: The entrant's index in entry order.
        schema: {type: integer, minimum: 0}
    post:
      tags: [Leagues]
      operationId: disqualifyLeagueEntrant
      summary: Disqualify an entrant from a running league
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Admins only. The entrant loses the match it is playing, whose battle is
        stopped, and every match it reaches later is forfeited without a battle;
        matches already decided stand. Repeating the call returns `200` with the
        league unchanged. `409 conflict` when the league is not running, the entrant
        is already eliminated, or no other entrant that can still win would remain
        undisqualified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 200, description: Optional; stored trimmed.}
      responses:
        '200':
          description: The league after the disqualification.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/League'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/analytics:
    get:
      tags: [Analytics]
      operationId: getAnalytics
      summary: Summarize completed battles
      description: |
        Covers completed battles, newest first, at most
        5000 (`truncated` reports a cut). Every list is sorted, so equal data gives an
        equal report. Unit and upgrade figures use only results that carry per-type
        statistics; older results count for outcomes alone.
      parameters:
        - name: leagueId
          in: query
          description: Only battles played for this league.
          schema: {type: string, format: uuid}
        - name: rulesVersion
          in: query
          description: Omit for the current rules version; `all` includes every version.
          schema: {type: string}
        - name: since
          in: query
          description: Only battles completed at or after this time.
          schema: {type: string, format: date-time}
        - name: excludeFallback
          in: query
          description: Leave out battles where any model decision fell back, including fallbacks a retry reused from an earlier attempt.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyticsReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/admin/model-access:
    get:
      tags: [Administration]
      operationId: getModelAccess
      summary: Read the model access policy
      description: Admin only; unavailable in role preview.
      responses:
        '200':
          description: The policy and configured models.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelAccessView'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [Administration]
      operationId: saveModelAccess
      summary: Replace the model access policy
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        Must include every configured provider and profile with no extras. A stale
        `version` returns `409`. The policy restricts only new selections; it cannot
        enable a profile whose credentials or runtime are unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelAccessSettings'}
      responses:
        '200':
          description: The saved policy.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelAccessSettings'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/admin/members:
    get:
      tags: [Administration]
      operationId: listMembers
      summary: List managed Players and Testers
      description: Admin only. Returns `503` when managed Players are not configured.
      responses:
        '200':
          description: Members and synchronization state.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [members, syncError, gameUrl]
                properties:
                  members:
                    type: array
                    items: {$ref: '#/components/schemas/Member'}
                  syncError:
                    description: Sanitized group-level synchronization failure.
                    type: string
                  gameUrl: {type: string}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [Administration]
      operationId: grantMember
      summary: Grant, reinvite or change the role of a member
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: |
        `202` confirms persisted intent, not Cloudflare admission. A new member
        without `role` is a Player; an existing member keeps its stored role unless
        `role` names another one. Changing only the role of an active member needs no
        Cloudflare update and applies to the member's next request. Granting an
        unchanged intent is idempotent. A configured Admin or Tester email returns
        `409`; any other `role` value returns `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
                role: {$ref: '#/components/schemas/MemberRole'}
            example: {email: friend@example.com, role: tester}
      responses:
        '202':
          description: Intent persisted; synchronization queued.
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/admin/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [Administration]
      operationId: removeMember
      summary: Remove a member's access
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      description: Removes desired access immediately and queues synchronization.
      responses:
        '202':
          description: Removal persisted.
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/admin/members/retry:
    post:
      tags: [Administration]
      operationId: retryMemberSync
      summary: Retry synchronizing the complete desired membership
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '202':
          description: Retry requested.
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  securitySchemes:
    cloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: |
        Production. Cloudflare Access supplies this JWT on every `/v1` request; the
        legacy session cookie is never accepted in this mode.
    sessionCookie:
      type: apiKey
      in: cookie
      name: battlefield_session
      description: Local development. Issued by `POST /v1/auth/login`.

  headers:
    NoStore:
      description: Responses are not cached.
      schema: {type: string, const: no-store}

  parameters:
    Origin:
      name: Origin
      in: header
      description: |
        Required on every mutating `/v1` request when the server is configured with a
        browser origin, as it is in production: the value must equal that origin
        exactly, or the request is rejected with `403 permission_denied`. Browsers
        send it automatically; other clients must set it. A non-empty body must also
        be `application/json`, or the request is rejected with `415`.
      required: false
      schema: {type: string, format: uri, examples: ['https://battlefield.example.org']}
    BattleId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    FactionId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LeagueId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    BattleResponse:
      description: The battle after the control was applied.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Battle'}
    InvalidRequest:
      description: Malformed input, `invalid_request`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {error: {code: invalid_request, message: invalid request body, requestId: 4f0c1e…}}
    AuthenticationRequired:
      description: Missing or invalid credentials, `authentication_required`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {error: {code: authentication_required, message: authentication required, requestId: 4f0c1e…}}
    PermissionDenied:
      description: |
        The caller lacks permission, `permission_denied`. Also returned for
        unregistered routes so that route existence is not revealed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {error: {code: permission_denied, message: permission denied, requestId: 4f0c1e…}}
    NotFound:
      description: The resource does not exist, `not_found`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {error: {code: not_found, message: battle not found, requestId: 4f0c1e…}}
    MethodNotAllowed:
      description: Wrong method on an authentication route, `method_not_allowed`.
      headers:
        Allow:
          description: The methods the route supports.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: The resource's state forbids the change, `conflict`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {error: {code: conflict, message: battle is not active, requestId: 4f0c1e…}}
    AlreadyExists:
      description: The client-supplied identifier is already in use, `already_exists`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {error: {code: already_exists, message: battle already exists, requestId: 4f0c1e…}}
    UnsupportedMediaType:
      description: A non-empty body was not `application/json`, `unsupported_media_type`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationFailed:
      description: Well-formed input that the rules reject, `validation_failed`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: An allowance is exhausted, `rate_limited`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Internal:
      description: |
        The server failed, `internal_error`. The message is generic and never includes
        the underlying cause; quote `requestId` when reporting it.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotImplemented:
      description: The capability is not available in this deployment, `not_implemented`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unavailable:
      description: A dependency or configuration is unavailable, `service_unavailable`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {$ref: '#/components/schemas/ErrorCode'}
            message:
              type: string
              description: Human-readable; may change between releases.
            requestId:
              type: string
              description: |
                Equals the `X-Request-ID` response header and the server's `request_id`
                log field. Omitted when no request identifier is in scope.

    ErrorCode:
      description: Stable. Add new values rather than renaming existing ones.
      type: string
      enum:
        - invalid_request
        - validation_failed
        - unsupported_media_type
        - method_not_allowed
        - authentication_required
        - permission_denied
        - not_found
        - conflict
        - already_exists
        - rate_limited
        - internal_error
        - service_unavailable
        - not_implemented

    Role:
      type: string
      enum: [admin, tester, player]

    SessionRole:
      description: |
        A `guest` signed in through the guest Access application, which is off unless
        configured, and can only view.
      type: string
      enum: [admin, tester, player, guest]

    Session:
      type: object
      required: [enabled, authenticated, mode]
      properties:
        enabled: {type: boolean}
        authenticated: {type: boolean}
        mode:
          description: |
            `cloudflare` in production, `local-password` for the local administrator
            login, and `disabled-development` when authentication is off.
          type: string
          enum: [cloudflare, local-password, disabled-development]
        actor:
          type: object
          required: [id, role]
          properties:
            id: {type: string}
            email: {type: string}
            role: {$ref: '#/components/schemas/SessionRole'}
        capabilities:
          type: object
          properties:
            inspect: {type: boolean}
            admin: {type: boolean}
            members: {type: boolean}

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}

    FactionEmblem:
      type: string
      enum: [star, crown, shield, swords, wolf, raven, serpent, tree, leaf, flame, sun, moon]

    FactionEmblemInput:
      description: Omitted or empty defaults to star on creation and preserves the saved choice on update.
      anyOf:
        - {$ref: '#/components/schemas/FactionEmblem'}
        - {type: string, const: ''}

    Faction:
      type: object
      required: [id, name, doctrine, ownerId, emblem]
      properties:
        id: {type: string, format: uuid}
        ownerId: {type: string}
        emblem: {$ref: '#/components/schemas/FactionEmblem'}
        name: {type: string}
        doctrine: {type: string}
        background:
          description: Omitted when empty.
          type: string

    CreateFactionRequest:
      type: object
      additionalProperties: false
      required: [id, name, doctrine]
      properties:
        emblem: {$ref: '#/components/schemas/FactionEmblemInput'}
        id: {type: string, format: uuid}
        name:
          description: Trimmed before storage; must be non-empty.
          type: string
        doctrine:
          description: Trimmed; non-empty and at most 4,000 Unicode characters.
          type: string
        background:
          description: Optional; at most 1,000 Unicode characters.
          type: string

    UpdateFactionRequest:
      type: object
      additionalProperties: false
      required: [name, doctrine]
      properties:
        emblem: {$ref: '#/components/schemas/FactionEmblemInput'}
        name: {type: string}
        doctrine: {type: string}
        background: {type: string}

    Ruleset:
      description: |
        Catalog data: starting gold, units, upgrades, optional `structures`, and the
        shared `buildings.maximumBuildingCount` limit (at most 16; ruleset v8 uses 12 and v9 uses 16, with up to 4 economy buildings). Production structures expose `trains`
        arrays of supported unit IDs. Core v7 enables continuousProduction and starts each faction with only a castle,
        which trains the Barracks roster and attacks enemies. Resolved buildings rules
        include castleTrains (unit IDs), castleAttack (15) and castleRange (3).
        Core v8 units may set `requiresUpgradeId`, the upgrade a faction must own before
        training them; its bonus-free `gunpowder` and `knighthood` upgrades exist only as unlocks.
        Fields vary by ruleset version.
      type: object
      required: [id]
      properties:
        id: {type: string}
        continuousProduction: {type: boolean, default: false, description: Repeating per-building unit selection and on/off settings; absent or false retains historical batch recruitment.}
        alternatingTurns: {type: boolean, default: false, description: 'Each tick, the factions act in seat order with the first seat alternating, and equal-speed units of the two factions take turns; absent or false orders buildings and units by ID.'}
        alternatingWindows: {type: boolean, default: false, description: 'Requires alternatingTurns. The first seat also changes from one decision window to the next, so neither seat leads every window; absent or false alternates on tick parity alone.'}
        maximumUnitCount: {type: integer, minimum: 0, maximum: 200, description: 'Per-faction cap on living units plus paid units in training; absent or 0 is unlimited. Rulesets v8 and v9 use 40; v10 to v13 use 50.'}
        upgrades:
          type: array
          items: {$ref: '#/components/schemas/UpgradeRule'}
      additionalProperties: true

    UpgradeRule:
      type: object
      required: [id, cost, attackBonus, defenseBonus, economyIncomeBonus]
      description: A one-time purchase with incremental bonuses. Level and specialization metadata describe the shared catalog; old snapshots may omit it.
      properties:
        id: {type: string}
        cost: {type: integer, minimum: 1}
        track: {type: string}
        level: {type: integer, minimum: 1, maximum: 3}
        requiresUpgradeId: {type: string, description: Must be owned or ordered earlier in the same plan.}
        targetUnit: {type: string, description: Applies only to this unit type.}
        targetClass: {type: string, description: Applies only to this class; mutually exclusive with targetUnit.}
        exclusiveGroup: {type: string, description: Only one upgrade ID in this group may be chosen per battle.}
        movementBonus: {type: integer, minimum: 0}
        rangeBonus: {type: integer, minimum: 0}
        healAmountBonus: {type: integer, minimum: 0}
        healRangeBonus: {type: integer, minimum: 0}
        buildingDamageBonus: {type: integer, minimum: 0}
        attackBonus: {type: integer, minimum: 0}
        defenseBonus: {type: integer, minimum: 0}
        economyIncomeBonus: {type: integer, minimum: 0}

    ScenarioSummary:
      description: A map layout with shared battle settings and the full shared content catalog.
      type: object
      required: [id, rulesVersion, rulesetId, tickDuration, decisionIntervalTicks, maximumTicks, mapWidth, mapHeight, map]
      properties:
        id: {type: string, examples: [castle-siege]}
        rulesVersion: {type: string}
        rulesetId: {type: string}
        tickDuration: {type: string, examples: [1s]}
        decisionIntervalTicks: {type: integer}
        maximumTicks: {type: integer}
        mapWidth: {type: integer}
        mapHeight: {type: integer}
        map: {$ref: '#/components/schemas/BattleMap'}
        allowedUnits: {type: [array, 'null'], items: {type: string}}
        allowedUpgrades: {type: [array, 'null'], items: {type: string}}
        allowedBuildings: {type: [array, 'null'], items: {type: string}}

    ModelOption:
      type: object
      required: [id]
      properties:
        id: {type: string}
        reasoningEfforts: {type: array, items: {type: string}}
        defaultReasoningEffort: {type: string}

    ModelProfile:
      description: Players receive only `id`, `displayName`, `modelLabel`, `runtime`, `available`, and `modelOptions`.
      type: object
      required: [id, displayName, runtime, available]
      properties:
        id: {type: string}
        displayName: {type: string}
        provider: {type: string}
        runtime: {type: string}
        scope: {type: string}
        modelLabel: {type: string}
        modelOptions: {type: array, items: {$ref: '#/components/schemas/ModelOption'}}
        available: {type: boolean}
        toolCapability: {type: boolean}
        unavailableReason: {type: string}

    BattleStatus:
      type: string
      enum: [queued, running, completed, failed, stopped]

    Controller:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [scripted, model]}
        profileId: {type: string}
        provider: {type: string}
        runtime: {type: string}
        modelIdentifier: {type: string}
        reasoningEffort: {type: string}

    CreateBattleRequest:
      type: object
      additionalProperties: false
      required: [id, scenarioId, participants, tickCount]
      properties:
        id:
          description: |
            Client-generated. A matching retry returns the existing battle; reuse with
            different parameters returns `409 already_exists`.
          type: string
          format: uuid
        scenarioId: {type: string}
        participants:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [factionId, controller]
            properties:
              factionId: {type: string, format: uuid}
              controller:
                type: object
                additionalProperties: false
                required: [type]
                properties:
                  type: {type: string, enum: [scripted, model]}
                  profileId:
                    description: Required when `type` is `model`.
                    type: string
                  modelIdentifier:
                    description: Operator-allowlisted model; omission uses the profile default.
                    type: string
                  reasoningEffort:
                    description: Supported effort for the selected model; omission uses the configured option default or provider default.
                    type: string
        tickDuration:
          description: Optional Go duration from 100ms to 10s inclusive; omission or null uses the map default. Frozen in the scenario snapshot and digest.
          type: [string, 'null']
          example: 500ms
        decisionIntervalTicks:
          description: Optional ticks between decisions after the opening; omission or null uses the map default. May exceed tickCount.
          type: [integer, 'null']
          minimum: 1
          maximum: 100
        tickCount:
          description: At most the scenario's `maximumTicks`.
          type: integer
          minimum: 1

    Position:
      type: object
      required: [x, y]
      properties:
        x: {type: integer}
        y: {type: integer}

    BattleMap:
      type: object
      required: [kind, width, height, rows, castleSpawns, economySites]
      properties:
        kind: {type: string, examples: [authored]}
        width: {type: integer}
        height: {type: integer}
        rows: {type: array, items: {type: string}, description: "Authored symbols: . ground, # rock, f forest (+3 troop defense), g gold mine (economy buildings only; finite gold under gold-mine rulesets, otherwise +5 economy income). Legacy b pads remain readable."}
        castleSpawns:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: '#/components/schemas/Position'}
        economySites:
          description: Legacy authored pads; current maps return two null/empty entries and use building range.
          type: array
          minItems: 2
          maxItems: 2
          items: {type: [array, 'null'], items: {$ref: '#/components/schemas/Position'}}
        goldMineReserve:
          description: Gold each mine on this map starts with. Scenario summaries report the effective value; frozen battle maps omit it when the ruleset default applies.
          type: integer
          minimum: 0

    BattleState:
      description: |
        Simulation state at `tick`. Optional unit and building fields appear only in
        rulesets that use them, and older snapshots may omit them; an absent field
        uses documented legacy defaults. Faction views include all battlefield entities
        and actions; see [api.md](./api.md#battle-state-and-visibility).

        The arrays are `null`, not `[]`, when empty — for example a newly queued
        battle whose units have not yet been recruited. Treat `null` as empty.
      type: object
      required: [battleId, tick, factions, units, buildings]
      properties:
        battleId: {type: string}
        tick: {type: integer}
        openingComplete:
          description: True once the one-time opening purchase has run. Omitted until then.
          type: boolean
        factions:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/FactionState'}
        units:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Unit'}
        buildings:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Building'}
        unitDeaths:
          description: |
            Confirmed unit deaths in the current tick, cleared at the next tick.
            Omitted when there are none and in older snapshots. Clients must not infer
            death from disappearance.
          type: [array, 'null']
          items: {$ref: '#/components/schemas/UnitDeath'}
        goldMines:
          description: |
            One entry per map gold mine, in row order, under rulesets with finite gold
            mines. Omitted for other rulesets and in older snapshots. A mine with
            `remaining: 0` is depleted and yields nothing.
          type: array
          items: {$ref: '#/components/schemas/GoldMine'}

    GoldMine:
      type: object
      required: [position, reserve, remaining]
      properties:
        position: {$ref: '#/components/schemas/Position'}
        reserve: {type: integer, description: Gold the mine started with.}
        remaining: {type: integer, description: Gold left; an economy building on the mine draws its income from it.}

    FactionState:
      type: object
      required: [factionId, gold, recruitmentCursor, goldEarned, goldSpent, goldLooted, unitsStarted, unitsRecruited, unitsLost, buildingsBuilt, buildingsDestroyed]
      properties:
        factionId: {type: string}
        gold: {type: integer}
        ownedUpgradeIds: {type: array, items: {type: string}}
        recruitmentCursor:
          description: Position in a legacy `recruitmentPriorities` rotation.
          type: integer
        goldEarned: {type: integer}
        goldSpent: {type: integer}
        goldLooted: {type: integer}
        unitsStarted: {type: integer}
        unitsRecruited: {type: integer}
        unitsLost: {type: integer}
        buildingsBuilt: {type: integer}
        buildingsDestroyed: {type: integer}

    AttackMode:
      description: |
        `tracking` (the default when omitted) hits the chosen target wherever it is;
        `position` aims at the target's hex at the start of the tick and misses if
        nothing is there when the shot lands.
      type: string
      enum: [tracking, position]

    AttackOutcome:
      description: Set for the tick in which the entity attacked; cleared with other per-tick actions.
      type: string
      enum: [hit, miss]

    Unit:
      description: |
        Statistics are copied from the ruleset at recruitment, with upgrades applied.
        The fields from `movementPath` onward describe what the unit did in the
        current tick and are cleared at the next one.
      type: object
      required: [id, factionId, type, position, health, maxHealth, attack, defense, speed, movement, range, vision, cost, readyAtTick]
      properties:
        id: {type: string}
        factionId: {type: string}
        type: {type: string}
        position: {$ref: '#/components/schemas/Position'}
        health: {type: integer}
        maxHealth: {type: integer}
        attack: {type: integer}
        defense: {type: integer}
        speed: {type: integer}
        movement: {type: integer}
        range: {type: integer}
        vision: {type: integer, deprecated: true, description: Legacy value; does not limit visibility or targeting.}
        cost: {type: integer}
        readyAtTick:
          description: First tick on which the unit can act.
          type: integer
        class: {type: string, examples: [infantry, mobile, siege, support]}
        minimumRange: {type: integer}
        buildingPriority:
          description: Prefers buildings over units when choosing targets.
          type: boolean
        buildingDamageBonus: {type: integer}
        bonusAgainstClass: {type: string}
        classDamageBonus: {type: integer}
        healAmount: {type: integer}
        healRange: {type: integer, description: Treatment range; omitted means one hex for legacy healers.}
        scout: {type: boolean}
        preferredTargetClass: {type: string}
        armorPiercing: {type: integer, description: Defense ignored against units only.}
        repairAmount: {type: integer}
        repairCost: {type: integer}
        repairCharges: {type: integer, description: Remaining lifetime repair actions; omitted means zero in state snapshots.}
        attackMode: {$ref: '#/components/schemas/AttackMode'}
        movementPath:
          description: The origin followed by each hex traversed this tick, ending at the destination.
          type: array
          items: {$ref: '#/components/schemas/Position'}
        movedFrom: {$ref: '#/components/schemas/Position'}
        attackTargetId:
          description: Absent on a miss.
          type: string
        attackTargetPosition:
          description: The impact hex for a `position` shot; the target's hex for a tracking attack.
          allOf: [{$ref: '#/components/schemas/Position'}]
        attackOutcome: {$ref: '#/components/schemas/AttackOutcome'}
        healTargetId: {type: string, description: Treatment or repair target.}
        healTargetPosition: {$ref: '#/components/schemas/Position'}

    Building:
      description: |
        Castles, economy buildings, and the structures a ruleset defines. Only
        attacking structures such as castles and defense towers carry `attack`, `range`, and the
        per-tick action fields. Destroyed records can remain in snapshots for result/history
        references; consumers should hide buildings whose health is zero or lower.
      type: object
      required: [id, factionId, type, position, health, maxHealth, defense, vision, cost, income]
      properties:
        buildRange: {type: integer, minimum: 0, maximum: 10, description: Construction reach in hexes; older snapshots with zero or no range use 3.}
        trains:
          type: array
          items: {type: string}
          description: Supported unit IDs for this production building. Current castles share the Barracks roster (vanguard, striker, pikeman); older snapshots may omit this field.
        production: {$ref: '#/components/schemas/BuildingProduction'}
        trainingBlocked: {type: boolean, description: A ready head is waiting for a free adjacent traversable tile.}
        trainingQueue:
          type: array
          maxItems: 12
          description: Zero or one paid unit in continuous mode; up to twelve in historical batch mode.
          items: {$ref: '#/components/schemas/TrainingOrder'}
        id: {type: string}
        factionId: {type: string}
        type: {type: string, examples: [castle, economy, barracks, archery_range, stables, siege_workshop, infirmary, outpost, defense_tower]}
        position: {$ref: '#/components/schemas/Position'}
        health: {type: integer}
        maxHealth: {type: integer}
        defense: {type: integer}
        vision: {type: integer, deprecated: true, description: Legacy value; does not limit visibility or targeting.}
        cost: {type: integer}
        income: {type: integer}
        attack: {type: integer}
        range: {type: integer}
        readyAtTick:
          description: First tick on which the structure grants range, attacks or accepts training orders.
          type: integer
        attackTargetId: {type: string}
        attackTargetPosition: {$ref: '#/components/schemas/Position'}
        attackOutcome: {$ref: '#/components/schemas/AttackOutcome'}

    BuildingProduction:
      description: AI-only repeating production setting. Off or selection changes preserve the paid unit. Absent on historical batch-mode buildings and on opponent buildings in faction-scoped views. The full spectator state retains both sides.
      type: object
      required: [enabled]
      properties:
        configured: {type: boolean, description: An explicit AI selection or off order has been applied; scripted fallback preserves it.}
        unitType: {type: string, description: Selected type; absent until configured.}
        enabled: {type: boolean, description: Start another unit whenever the current unit has deployed and gold permits.}
        waitingForGold: {type: boolean, description: Enabled with no paid unit and insufficient gold above reserveGold. Automatically retries each tick.}
        waitingForUnitLimit: {type: boolean, description: Enabled with no paid unit while the faction is at maximumUnitCount. Starts without charge once a unit slot frees.}
        waitingForUpgrade: {type: boolean, description: Enabled with no paid unit because the selected type's requiresUpgradeId is not owned yet. Starts without charge once the unlock is bought.}

    TrainingOrder:
      description: Paid FIFO entry; only the head trains. Units act the tick after deployment.
      type: object
      required: [unitType, trainingTicks, remainingTicks, queuedAtTick]
      properties:
        unitType: {type: string}
        trainingTicks: {type: integer, minimum: 1, maximum: 1000}
        remainingTicks: {type: integer, minimum: 0, maximum: 1000}
        queuedAtTick: {type: integer, minimum: 0}
        opening: {type: boolean, description: Counts toward unitsStarted when deployed.}

    UnitDeath:
      type: object
      required: [id, factionId, type, position]
      properties:
        id: {type: string}
        factionId: {type: string}
        type: {type: string}
        position: {$ref: '#/components/schemas/Position'}

    BattleResult:
      type: object
      required: [winnerFactionId, reason, ticksRun, factions]
      properties:
        winnerFactionId:
          description: Null for a draw.
          type: [string, 'null']
        reason: {type: string, examples: [castle_destroyed, tick_limit]}
        ticksRun: {type: integer}
        factions:
          type: array
          items: {$ref: '#/components/schemas/FactionStatistics'}

    FactionStatistics:
      description: |
        One faction's after-action totals. `unitTypes`, `buildingTypes` and `upgrades`
        are omitted when empty, and from results written before per-type statistics.
        A type appears only after the faction fielded, built, lost or damaged one.
      type: object
      required: [factionId]
      additionalProperties: true
      properties:
        factionId: {type: string}
        unitTypes:
          type: array
          items: {$ref: '#/components/schemas/UnitTypeStatistics'}
        buildingTypes:
          type: array
          items: {$ref: '#/components/schemas/BuildingTypeStatistics'}
        upgrades:
          description: Purchases in order, each at the tick it was bought.
          type: array
          items:
            type: object
            required: [upgradeId, tick]
            properties:
              upgradeId: {type: string}
              tick: {type: integer}

    UnitTypeStatistics:
      description: |
        `kills` and `buildingsDestroyed` (castle included) count destroying blows.
        `healthRestored` is healing by support units or repairs by engineers.
        `goldSpent` is the price paid to queue the type, excluding repair costs.
      type: object
      required: [unitType, started, recruited, lost, kills, buildingsDestroyed, damageDealt, damageTaken, healthRestored, goldSpent]
      properties:
        unitType: {type: string}
        started: {type: integer, description: Opening or starting units.}
        recruited: {type: integer}
        lost: {type: integer}
        kills: {type: integer}
        buildingsDestroyed: {type: integer}
        damageDealt: {type: integer}
        damageTaken: {type: integer}
        healthRestored: {type: integer}
        goldSpent: {type: integer}

    BuildingTypeStatistics:
      description: |
        `kills` counts enemy units destroyed by the building's own attacks. The castle
        appears when it took damage; it is never constructed.
      type: object
      required: [buildingType, constructed, lost, kills, damageDealt, damageTaken, goldSpent]
      properties:
        buildingType: {type: string}
        constructed: {type: integer}
        lost: {type: integer}
        kills: {type: integer}
        damageDealt: {type: integer}
        damageTaken: {type: integer}
        goldSpent: {type: integer}

    Battle:
      description: |
        Players and Guests receive the same shape without `scenarioDigest` and
        `errorCode`.
      type: object
      required: [id, ownerId, scenarioId, requestedTicks, currentTick, production, status, paused, attempt, participants, result, map, state]
      properties:
        id: {type: string, format: uuid}
        ownerId: {type: string}
        scenarioId: {type: string}
        scenarioDigest: {type: string}
        requestedTicks: {type: integer}
        currentTick: {type: integer}
        maximumUnits:
          description: |
            Per-faction unit cap from the battle's ruleset snapshot (`maximumUnitCount`),
            counting living units plus paid units in training. Omitted when unlimited.
          type: integer
          minimum: 1
        contestedTerritory:
          description: |
            True when the battle's ruleset snapshot closes construction where faction
            territories overlap (`buildings.contestedTerritory`). Omitted otherwise.
          type: boolean
        production:
          description: |
            The next strategy/construction/upgrade window, derived by the engine from
            the battle's scenario snapshot and current state. `null` when the battle
            is not queued or running, or when no window remains before
            `requestedTicks`.
          oneOf:
            - {$ref: '#/components/schemas/ProductionSchedule'}
            - {type: 'null'}
        status: {$ref: '#/components/schemas/BattleStatus'}
        paused: {type: boolean}
        attempt:
          description: '`0` until a worker first admits the battle, then 1 or higher.'
          type: integer
          minimum: 0
        participants:
          type: array
          items:
            type: object
            required: [id, name, controller]
            properties:
              id: {type: string}
              name: {type: string}
              background: {type: string}
              doctrine: {type: string}
              controller: {$ref: '#/components/schemas/Controller'}
        result:
          oneOf:
            - {$ref: '#/components/schemas/BattleResult'}
            - {type: 'null'}
        map: {$ref: '#/components/schemas/BattleMap'}
        state: {$ref: '#/components/schemas/BattleState'}
        errorCode: {type: string}
        errorMessage: {type: string}
        league:
          description: Present only for a league battle.
          $ref: '#/components/schemas/BattleLeague'

    BattleLeague:
      type: object
      required: [id, name, fixtureId, stage, round, tie]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        fixtureId: {type: string, format: uuid}
        stage: {$ref: '#/components/schemas/LeagueStage'}
        group: {type: string, enum: [A, B, C, D], description: Group-stage fixtures only.}
        round: {type: integer, minimum: 1, maximum: 3}
        tie: {type: integer, minimum: 1}
        match: {$ref: '#/components/schemas/LeagueMatch'}

    LeagueMatch:
      description: |
        A group fixture's match in its dual tournament, absent for knockout fixtures:
        round 1 holds the two `opening` matches, round 2 the `winners` (tie 1) and
        `losers` (tie 2) matches, and round 3 the `decider`.
      type: string
      enum: [opening, winners, losers, decider]

    LeagueStage: {type: string, enum: [group, quarterfinal, semifinal, final]}

    CreateLeagueRequest:
      type: object
      additionalProperties: false
      required: [id, name, scenarioIds, tickCount, entrants]
      properties:
        id: {type: string, format: uuid, description: Client-generated; see the idempotency rules.}
        name: {type: string, minLength: 1, maxLength: 80}
        scenarioIds:
          description: One to five distinct maps. Matches rotate through them, each group's five in turn and then the knockout ties.
          type: array
          minItems: 1
          maxItems: 5
          items: {type: string}
        tickCount: {type: integer, minimum: 1, description: At most every chosen scenario's `maximumTicks`.}
        tickDuration: {type: [string, 'null'], description: As for battle creation.}
        decisionIntervalTicks: {type: [integer, 'null'], minimum: 1, maximum: 100, description: As for battle creation.}
        entrants:
          description: 8 or 16 entrants, four per group. Entry order seeds each group's opening matches and is the final tiebreak.
          type: array
          minItems: 8
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [factionId, group, controller]
            properties:
              factionId: {type: string, format: uuid}
              group: {type: string, enum: [A, B, C, D]}
              controller:
                type: object
                additionalProperties: false
                required: [type]
                properties:
                  type: {type: string, enum: [scripted, model]}
                  profileId: {type: string}
                  modelIdentifier: {type: string}
                  reasoningEffort: {type: string}

    LeagueProgress:
      type: object
      required: [settled, total]
      properties:
        settled: {type: integer, description: Fixtures completed, void or cancelled.}
        total: {type: integer, description: Fixtures the league plays when nothing is cancelled, 13 or 27.}

    LeagueSummary:
      type: object
      required: [id, ownerId, name, status, groupCount, entrantCount, champion, progress, createdAt, completedAt]
      properties:
        id: {type: string, format: uuid}
        ownerId: {type: string}
        name: {type: string}
        status: {type: string, enum: [running, completed, cancelled]}
        groupCount: {type: integer, enum: [2, 4]}
        entrantCount: {type: integer, enum: [8, 16]}
        champion:
          oneOf:
            - type: object
              required: [entrant, factionName]
              properties:
                entrant: {type: integer}
                factionName: {type: string}
            - {type: 'null'}
        progress: {$ref: '#/components/schemas/LeagueProgress'}
        createdAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}

    League:
      description: Entrants are referred to by their `index`.
      type: object
      required: [id, ownerId, name, status, groupCount, settings, champion, progress, entrants, groups, knockout, fixtures, createdAt, completedAt]
      properties:
        id: {type: string, format: uuid}
        ownerId: {type: string}
        name: {type: string}
        status: {type: string, enum: [running, completed, cancelled]}
        groupCount: {type: integer, enum: [2, 4]}
        settings:
          type: object
          required: [scenarioIds, tickCount]
          properties:
            scenarioIds: {type: array, items: {type: string}}
            tickCount: {type: integer}
            tickDuration: {type: string}
            decisionIntervalTicks: {type: integer}
        champion: {type: [integer, 'null'], description: The champion's entrant index once the final settles.}
        progress: {$ref: '#/components/schemas/LeagueProgress'}
        entrants:
          type: array
          items:
            type: object
            required: [index, group, factionId, factionName, controller, eliminated, disqualification]
            properties:
              index: {type: integer}
              group: {type: string, enum: [A, B, C, D]}
              factionId: {type: string, format: uuid}
              factionName: {type: string, description: Copied when the league was created.}
              controller: {$ref: '#/components/schemas/Controller'}
              eliminated: {type: boolean, description: True after two group losses or a knockout loss.}
              disqualification:
                description: Null unless an Admin disqualified the entrant.
                type: [object, 'null']
                required: [at, by, reason]
                properties:
                  at: {type: string, format: date-time}
                  by: {type: string, description: The Admin's user ID.}
                  reason: {type: string, maxLength: 200, description: Empty when none was given.}
        groups:
          description: |
            Each group's records, ordered by wins, then fewer losses, then entry
            order, which is also the order of their placements.
          type: array
          items:
            type: object
            required: [group, standings]
            properties:
              group: {type: string, enum: [A, B, C, D]}
              standings:
                type: array
                items: {$ref: '#/components/schemas/LeagueStanding'}
        knockout:
          description: |
            Ties in stage order, each one match. `winner` is null until the match is
            completed, void or forfeited.
          type: array
          items:
            type: object
            required: [stage, tie, homeEntrant, awayEntrant, winner]
            properties:
              stage: {$ref: '#/components/schemas/LeagueStage'}
              tie: {type: integer, minimum: 1}
              homeEntrant: {type: integer, description: Takes the first spawn side.}
              awayEntrant: {type: integer}
              winner: {type: [integer, 'null']}
        fixtures:
          type: array
          items: {$ref: '#/components/schemas/LeagueFixture'}
        createdAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}

    LeagueStanding:
      type: object
      required: [entrant, placement, won, lost]
      properties:
        entrant: {type: integer}
        placement: {type: [integer, 'null'], minimum: 1, maximum: 4, description: Null until the group decides it.}
        won: {type: integer, description: Matches won, including by tiebreak.}
        lost: {type: integer}

    LeagueFixture:
      description: |
        One match, played as one battle; the home entrant, chosen by a coin flip,
        takes the first spawn side. A failed or stopped battle is retried once with a
        new battle, then the fixture is void. A match a disqualified entrant was
        playing or reaches later is `forfeited`, with or without a battle.
      type: object
      required: [id, sequence, stage, round, tie, homeEntrant, awayEntrant, scenarioId, status, attempts, battleId, winner]
      properties:
        id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 0, description: Play order.}
        stage: {$ref: '#/components/schemas/LeagueStage'}
        group: {type: string, enum: [A, B, C, D]}
        round: {type: integer, minimum: 1, maximum: 3}
        tie: {type: integer, minimum: 1}
        match: {$ref: '#/components/schemas/LeagueMatch'}
        homeEntrant: {type: integer}
        awayEntrant: {type: integer}
        scenarioId: {type: string}
        status: {type: string, enum: [pending, running, completed, void, cancelled, forfeited]}
        attempts: {type: integer, minimum: 0, maximum: 2}
        battleId: {type: [string, 'null'], format: uuid}
        battleProgress:
          description: Present while the fixture is running and its battle exists.
          type: object
          required: [currentTick, requestedTicks]
          properties:
            currentTick: {type: integer, minimum: 0}
            requestedTicks: {type: integer, minimum: 1}
        result:
          description: Present once the fixture completed.
          type: object
          required: [winner, reason]
          properties:
            winner: {type: [integer, 'null'], description: The battle's winner; null for a draw.}
            reason: {type: string, examples: [castle_destroyed, tick_limit]}
        forfeit:
          description: Present once forfeited, naming the disqualified side; with `both`, the higher seed wins.
          type: string
          enum: [home, away, both]
        winner:
          type: [integer, 'null']
          description: The match winner once the fixture is completed, void or forfeited, by the league tiebreak where the battle had none; null before.

    AnalyticsController:
      description: 'A model controller, or `{type: scripted}`.'
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [scripted, model]}
        profileId: {type: string}
        provider: {type: string}
        runtime: {type: string}
        modelIdentifier: {type: string}
        reasoningEffort: {type: string}

    AnalyticsOutcome:
      description: |
        Win record. `winRate` counts draws as non-wins; `winRateLow` and
        `winRateHigh` bound it with the 95% Wilson score interval.
      type: object
      required: [battles, wins, draws, losses, castleWins, winRate, winRateLow, winRateHigh, meanTicksToWin]
      properties:
        battles: {type: integer}
        wins: {type: integer}
        draws: {type: integer}
        losses: {type: integer}
        castleWins: {type: integer, description: Wins by destroying the enemy castle.}
        winRate: {type: number}
        winRateLow: {type: number}
        winRateHigh: {type: number}
        meanTicksToWin: {type: [number, 'null']}

    AnalyticsReport:
      type: object
      required: [rulesVersion, truncated, excludedForFallback, battles, battlesWithFallback, sidesWithUnitStats, models, factions, headToHead, units, unitsByModel, upgrades, maps]
      properties:
        rulesVersion: {type: [string, 'null'], description: The rules version covered; null for every version.}
        truncated: {type: boolean}
        excludedForFallback: {type: integer}
        battles: {type: integer}
        battlesWithFallback: {type: integer}
        sidesWithUnitStats: {type: integer, description: Sides whose results carry per-type statistics.}
        models:
          description: One entry per controller, best win rate first; a mirror match counts once per side.
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/AnalyticsOutcome'}
              - type: object
                required: [controller, decisions, fallbackRate, invalidPlanRate, meanDecisionLatencyMs, tokensPerBattle]
                properties:
                  controller: {$ref: '#/components/schemas/AnalyticsController'}
                  decisions: {type: integer, description: Model decisions in the battles' final attempts.}
                  fallbackRate: {type: number}
                  invalidPlanRate: {type: number}
                  meanDecisionLatencyMs: {type: [number, 'null']}
                  tokensPerBattle:
                    type: object
                    required: [input, cachedInput, output]
                    properties:
                      input: {type: number}
                      cachedInput: {type: number}
                      output: {type: number}
        factions:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/AnalyticsOutcome'}
              - type: object
                required: [factionId, factionName]
                properties:
                  factionId: {type: string}
                  factionName: {type: string}
        headToHead:
          description: Each pair of different controllers, both ways round.
          type: array
          items:
            type: object
            required: [controller, opponent, battles, wins, draws, losses]
            properties:
              controller: {$ref: '#/components/schemas/AnalyticsController'}
              opponent: {$ref: '#/components/schemas/AnalyticsController'}
              battles: {type: integer}
              wins: {type: integer}
              draws: {type: integer}
              losses: {type: integer}
        units:
          type: array
          items:
            type: object
            required: [unitType, fielded, recruited, lost, kills, buildingsDestroyed, damageDealt, damageTaken, healthRestored, goldSpent, killsPerLoss, damagePerGold, shareInWins, shareInLosses]
            properties:
              unitType: {type: string}
              fielded: {type: integer}
              recruited: {type: integer}
              lost: {type: integer}
              kills: {type: integer}
              buildingsDestroyed: {type: integer}
              damageDealt: {type: integer}
              damageTaken: {type: integer}
              healthRestored: {type: integer}
              goldSpent: {type: integer}
              killsPerLoss: {type: [number, 'null']}
              damagePerGold: {type: [number, 'null']}
              shareInWins: {type: number, description: Share of all units recruited by winning sides.}
              shareInLosses: {type: number, description: Share of all units recruited by losing sides.}
        unitsByModel:
          type: array
          items:
            type: object
            required: [controller, unitType, recruited, armyShare]
            properties:
              controller: {$ref: '#/components/schemas/AnalyticsController'}
              unitType: {type: string}
              recruited: {type: integer}
              armyShare: {type: number, description: Share of the controller's recruited units.}
        upgrades:
          type: array
          items:
            type: object
            required: [upgradeId, purchases, purchaseRate, meanPurchaseTick, winRateWhenPurchased, winRateWhenNot]
            properties:
              upgradeId: {type: string}
              purchases: {type: integer}
              purchaseRate: {type: number}
              meanPurchaseTick: {type: number}
              winRateWhenPurchased: {type: [number, 'null']}
              winRateWhenNot: {type: [number, 'null'], description: Null when every side bought it.}
        maps:
          type: array
          items:
            type: object
            required: [scenarioId, battles, draws, drawRate, meanTicks, sides]
            properties:
              scenarioId: {type: string}
              battles: {type: integer}
              draws: {type: integer}
              drawRate: {type: number}
              meanTicks: {type: number}
              sides:
                description: Spawn side 0 then side 1.
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: object
                  required: [wins, winRate]
                  properties:
                    wins: {type: integer}
                    winRate: {type: number}

    ProductionSchedule:
      description: |
        Construction/upgrades happen at decision windows. Continuous-mode buildings
        purchase and train units between windows; legacy mode purchases at windows. `opening` marks the one-time opening purchase before tick 1
        (`nextTick` is then `0`); otherwise `nextTick` is the tick whose
        transition runs the next regular window.
      type: object
      required: [nextTick, opening]
      properties:
        nextTick: {type: integer, minimum: 0}
        opening: {type: boolean}

    BattleView:
      type: object
      required: [map, state, visiblePositions]
      properties:
        map: {$ref: '#/components/schemas/BattleMap'}
        state: {$ref: '#/components/schemas/BattleState'}
        visiblePositions:
          deprecated: true
          description: Every map coordinate; current battles have full visibility.
          type: array
          items: {$ref: '#/components/schemas/Position'}

    BattleSummary:
      type: object
      required: [id, scenarioId, participants, status, paused, requestedTicks, currentTick, createdAt, startedAt, completedAt, outcome]
      properties:
        id: {type: string, format: uuid}
        scenarioId: {type: string}
        participants:
          type: array
          items:
            type: object
            required: [id, name, controller]
            properties:
              id: {type: string}
              name: {type: string}
              controller: {$ref: '#/components/schemas/Controller'}
        status: {$ref: '#/components/schemas/BattleStatus'}
        paused: {type: boolean}
        requestedTicks: {type: integer}
        currentTick: {type: integer}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        outcome:
          description: Only a completed battle with an outcome and no winner is a draw.
          oneOf:
            - type: object
              required: [winnerFactionId, reason]
              properties:
                winnerFactionId: {type: [string, 'null']}
                reason: {type: string}
            - {type: 'null'}

    BattleAllowance:
      description: |
        `limited` is false for an Admin, whose battles skip the allowances; the limit
        fields are then omitted. Unfinished battles are queued, running or paused.
      type: object
      required: [limited, startedToday, unfinished, serviceUnfinished, resetAt]
      properties:
        limited: {type: boolean}
        startedToday:
          description: Battles the caller started since 00:00 UTC.
          type: integer
          minimum: 0
        dailyLimit: {type: integer, minimum: 1}
        unfinished:
          description: The caller's unfinished battles.
          type: integer
          minimum: 0
        unfinishedLimit: {type: integer, minimum: 1}
        serviceUnfinished:
          description: Unfinished battles of every owner, including Admin battles.
          type: integer
          minimum: 0
        serviceUnfinishedLimit: {type: integer, minimum: 1}
        resetAt:
          description: The next 00:00 UTC, when `startedToday` restarts.
          type: string
          format: date-time

    BattleHistoryPage:
      type: object
      required: [battles, nextCursor]
      properties:
        battles:
          type: array
          items: {$ref: '#/components/schemas/BattleSummary'}
        nextCursor:
          description: Opaque; null when no more rows exist.
          type: [string, 'null']

    BattleEvent:
      description: |
        `data` depends on `type`. Players receive every event with an empty `data`
        object; Testers and Admins receive the payloads below. Positions are
        `{x, y}` objects.

        | `type` | `data` fields |
        | --- | --- |
        | `battle_started` | `battleId`, `scenarioId`, `rulesVersion`, `rulesetId`, `maximumTicks` |
        | `plan_applied` | `factionId`, `name`, `targetTick`, and `source` after the opening |
        | `tactic_selected` | `factionId`, `tactic`, `planName`, `source` |
        | `opening_completed` | none |
        | `income_collected` | `factionId`, `amount`, `balance` |
        | `unit_repaired` | `factionId`, `engineerId`, `targetId`, `amount`, `cost`, `balance`, `remainingHealth`, `repairCharges` |
        | `upgrade_purchased` | `factionId`, `upgradeId`, `cost`, `balance`; leveled entries also include `track`, `level`, `attackBonus`, `defenseBonus`, `economyIncomeBonus` (incremental effects) |
        | `building_constructed` | `factionId`, `buildingId`, `buildingType`, `position`, `cost` |
        | `unit_queued` | `factionId`, `sourceBuildingId`, `unitType`, `trainingTicks`, `cost`; charged once at enqueue |
        | `unit_recruited` | `factionId`, `unitId`, `unitType`, `position`, `readyAtTick`, `cost`, and `sourceBuildingId`; `cost` is informational unit value for compatibility, not a new expense; count only `unit_queued.cost` for recruitment spending |
        | `production_skipped` | `factionId`, `kind` (`upgrades`, `construction` or `recruitment`), `reason`, plus `upgradeId` or `position` where relevant; reasons include `prerequisite_required`, `exclusive_choice_owned`, `reserve_required`, `queue_full`, `source_unavailable`, `unit_not_trainable`, `invalid_terrain`, `outside_build_range`, `contested_territory`, `building_too_close`, `site_occupied` and `maximum_reached` |
        | `unit_moved` | `factionId`, `unitId`, `from`, `to` |
        | `unit_attacked`, `building_attacked` | `attackerId`, `targetId`, `targetType`, `damage`, `remainingHealth`, `attackMode`, `outcome: hit`, `impactPosition` |
        | `unit_attack_missed` | `attackerId`, `attackMode: position`, `outcome: miss`, `impactPosition` |
        | `unit_healed` | `factionId`, `healerId`, `targetId`, `amount` (health actually restored), `remainingHealth` |
        | `unit_destroyed` | `unitId`, `unitType`, `factionId`, and the destroying blow's `killerId`, `killerType` (unit or building type) and `killerFactionId`; older events carry only `unitId` and `factionId` |
        | `building_destroyed` | `buildingId`, `factionId`, `buildingType`, `killerId`, `killerType`, `killerFactionId` |
        | `castle_destroyed` | `castleId`, `factionId`, `destroyedByFactionId`, `killerId`, `killerType`, `killerFactionId` |
        | `loot_collected` | `factionId`, `sourceId`, `amount`, `balance` |
        | `tick_completed` | `tick` |
        | `battle_completed` | `winnerFactionId` (null for a draw), `reason` (`castle_destroyed` or `tick_limit`), `ticksRun` |
      type: object
      required: [attempt, sequence, tick, type, data, createdAt]
      properties:
        attempt: {type: integer}
        sequence: {type: integer}
        tick: {type: integer}
        type: {type: string, examples: [unit_moved, unit_recruited, unit_attacked, unit_healed]}
        data:
          type: object
          additionalProperties: true
        createdAt: {type: string, format: date-time}

    BattleEventPage:
      type: object
      required: [attempt, events, nextCursor]
      properties:
        attempt: {type: integer}
        events:
          type: array
          items: {$ref: '#/components/schemas/BattleEvent'}
        nextCursor: {type: [integer, 'null']}

    ReplayEvent:
      description: |
        An engine event with the same `type` and `data` contract as `BattleEvent`;
        Players receive an empty `data` object.
      type: object
      required: [sequence, tick, type, data]
      properties:
        sequence: {type: integer}
        tick: {type: integer}
        type: {type: string}
        data:
          type: object
          additionalProperties: true

    ReplayFrame:
      type: object
      required: [tick, state, events]
      properties:
        tick: {type: integer, minimum: 0}
        state: {$ref: '#/components/schemas/BattleState'}
        events:
          type: array
          description: The events this tick produced, ordered by sequence.
          items: {$ref: '#/components/schemas/ReplayEvent'}

    BattleReplay:
      type: object
      required: [battleId, attempt, finalTick, fromTick, toTick, nextTick, frames]
      properties:
        battleId: {type: string, format: uuid}
        attempt: {type: integer, minimum: 1, description: The final attempt being replayed.}
        finalTick: {type: integer, minimum: 0}
        fromTick: {type: integer, minimum: 0, description: The checkpoint tick that starts the segment.}
        toTick: {type: integer, minimum: 0}
        nextTick:
          type: [integer, 'null']
          description: The first tick of the next segment; null after `finalTick`.
        frames:
          type: array
          description: One frame per tick from `fromTick` to `toTick`.
          items: {$ref: '#/components/schemas/ReplayFrame'}

    Usage:
      type: object
      properties:
        inputTokens: {type: integer}
        outputTokens: {type: integer}
        requests: {type: integer}
        cachedInputTokens: {type: [integer, 'null']}
        reasoningOutputTokens: {type: [integer, 'null']}
        modelCalls: {type: [integer, 'null']}
        cliInvocations: {type: integer}
        scope: {type: string}
        tokensReported: {type: boolean}

    DecisionHistory:
      description: |
        Players receive only `requestId`, `factionId`, `targetTick`, `status`,
        `controllerType`, `resolvedPlan`, `createdAt` and `resolvedAt`; Testers and
        Admins always receive `usage`.
      type: object
      required: [requestId, factionId, targetTick, status, controllerType, createdAt]
      properties:
        requestId: {type: string, format: uuid}
        factionId: {type: string}
        targetTick: {type: integer}
        status: {type: string}
        controllerType: {type: string}
        profileId: {type: string}
        provider: {type: string}
        runtime: {type: string}
        modelIdentifier: {type: string}
        reasoningEffort: {type: string}
        fallbackSource: {type: string}
        errorCategory: {type: string}
        resolvedPlan: {$ref: '#/components/schemas/StrategyPlan'}
        usage: {$ref: '#/components/schemas/Usage'}
        traceUrl: {type: string}
        createdAt: {type: string, format: date-time}
        resolvedAt: {type: string, format: date-time}
        claimedAt: {type: string, format: date-time, description: Latest claim; absent for historical or never-claimed decisions.}
        contextServedAt: {type: string, format: date-time}
        runnerCompletedAt: {type: string, format: date-time, description: "Gateway receipt of worker completion, separate from plan acceptance."}
        contextDelivery: {type: string, enum: [tool, prefetch], description: "CLI context-delivery mode; omitted for historical records without this metadata."}
        cliProcessStartMs: {type: integer, minimum: 0, description: OS process creation only; does not measure CLI readiness.}

    StrategyPlan:
      description: |
        The plan the engine applied, from the model, the scripted controller, or a
        fallback. Optional order fields distinguish an explicit empty array (do
        nothing) from omission (legacy behavior).
      type: object
      required: [name]
      properties:
        name: {type: string}
        rationale: {type: string, maxLength: 600}
        actionWeights: {type: object, additionalProperties: {type: integer, minimum: 0, maximum: 10000}, description: Action kind to weight, where 1000 is 1x; an omitted or 0 weight counts as 1000.}
        targetBonuses: {type: object, additionalProperties: {type: integer}}
        reserveGold: {type: integer}
        spendOrder: {type: array, items: {type: string}}
        upgradeOrders: {type: array, items: {type: string}, description: Ordered unique purchase IDs. Prerequisites must be owned or ordered earlier; already owned levels are skipped free. exclusiveGroup permits one choice per battle.}
        constructionOrders:
          description: |
            At most eight typed orders. Omit to keep legacy `constructionPriorities`;
            supplying both typed orders and nonempty legacy priorities is rejected.
          type: array
          maxItems: 8
          items:
            type: object
            required: [buildingType, position]
            properties:
              buildingType: {type: string, examples: [defense_tower]}
              position: {$ref: '#/components/schemas/Position'}
        productionOrders:
          description: Persistent continuous-mode selections. Opening requires an explicit array. Omitted/empty orders leave existing settings unchanged. Each source must be active, owned and support unitType. Disabling preserves the paid unit; unitType may be omitted only when disabled.
          type: array
          maxItems: 9
          items:
            type: object
            required: [buildingId, enabled]
            properties:
              buildingId: {type: string}
              unitType: {type: string}
              enabled: {type: boolean}
        recruitmentOrders:
          description: |
            Legacy batch mode only (continuousProduction absent/false). Executed in order. At most six units in total across all orders; omit to
            keep legacy `recruitmentPriorities`.
          type: array
          maxItems: 6
          items:
            type: object
            required: [unitType, count]
            properties:
              unitType: {type: string}
              count: {type: integer, minimum: 1, maximum: 6}
              sourceBuildingId:
                description: An active owned source whose trains list includes the unit. Omit to select a compatible source with queue space nearest the enemy castle. Current castles train Vanguard, Striker and Pikeman. If no compatible source has queue space, implicit orders report source_unavailable; a named full source reports queue_full.
                type: string
        constructionPriorities:
          description: Legacy coordinate-only economy construction.
          type: array
          items: {$ref: '#/components/schemas/Position'}
        recruitmentPriorities:
          description: Legacy unit rotation.
          type: array
          items: {type: string}

    SavedDecisionContext:
      type: object
      required: [requestId, battleId, factionId, attempt, targetTick, observationTick, context]
      properties:
        requestId: {type: string, format: uuid}
        battleId: {type: string, format: uuid}
        factionId: {type: string}
        attempt: {type: integer}
        targetTick: {type: integer}
        observationTick: {type: integer}
        context:
          description: |
            Null for legacy records without a saved observation. Otherwise includes
            `factionName`, `background`, `doctrine`, `opening`, `ownedUpgradeIds`,
            `economy`, `view`, `legal`, `activePlan`, and optional `memory`/`knowledge`.
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: 'null'}
        initialContext:
          description: |
            Optional. The current agent projection, reconstructed from the saved
            observation; not a recording of the original model input.
          type: object
          additionalProperties: true
        availableUnitDetails:
          description: |
            Optional. The frozen unit reference the model could look up for this
            decision; not a record of lookups it made.
          type: object
          additionalProperties: true

    GenerationInput:
      type: object
      required: [name, doctrine, background]
      properties:
        name: {type: string}
        doctrine: {type: string}
        background: {type: string}

    CreateGenerationRequest:
      type: object
      additionalProperties: false
      required: [name, doctrine, idempotencyKey]
      properties:
        name: {type: string}
        doctrine: {type: string}
        background:
          description: Optional inspiration.
          type: string
        idempotencyKey:
          description: |
            Client-generated. A repeat with the same input replays the original job.
            Must not be blank and must be at most 200 bytes (UTF-8); otherwise the
            request returns `400 invalid_request`.
          type: string
          minLength: 1

    GenerationOptions:
      type: object
      required: [available, modelLabel, remaining, resetAt, retryAt]
      properties:
        available: {type: boolean}
        modelLabel: {type: string}
        reason: {type: string}
        remaining: {type: integer, minimum: 0}
        resetAt: {type: string, format: date-time}
        retryAt: {type: string, format: date-time}
        activeJobId: {type: string}

    GenerationJob:
      description: |
        A succeeded job is an editable draft, not a saved faction. Players receive only
        `id`, `status`, `background`, `modelLabel`, `createdAt`, and `expiresAt`; the
        remaining fields are returned to Testers and Admins.
      type: object
      required: [id, status, background, modelLabel, createdAt, expiresAt]
      properties:
        id: {type: string}
        input: {$ref: '#/components/schemas/GenerationInput'}
        profileId: {type: string}
        modelLabel: {type: string}
        promptVersion: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed, expired]}
        background: {type: string}
        errorCategory: {type: string}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        executionTimeoutSeconds: {type: integer}

    AccessPolicy:
      type: object
      required: [providers, profiles]
      properties:
        providers:
          description: Each configured provider mapped to an enabled flag.
          type: object
          additionalProperties: {type: boolean}
        profiles:
          description: Every configured profile. An empty `allowedRoles` denies everyone.
          type: object
          additionalProperties:
            type: object
            required: [enabled, allowedRoles]
            properties:
              enabled: {type: boolean}
              allowedRoles:
                type: array
                uniqueItems: true
                items: {$ref: '#/components/schemas/Role'}

    ModelAccessSettings:
      type: object
      additionalProperties: false
      required: [version, policy]
      properties:
        version:
          description: Optimistic-concurrency token; a stale value returns `409`.
          type: integer
        policy: {$ref: '#/components/schemas/AccessPolicy'}

    ModelAccessView:
      type: object
      required: [version, policy, models]
      properties:
        version: {type: integer}
        policy: {$ref: '#/components/schemas/AccessPolicy'}
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelProfile'}

    Member:
      description: Active only when `desiredAccess` is true and `version` equals `syncedVersion`.
      type: object
      required: [id, email, role, desiredAccess, version, syncedVersion, updatedAt]
      properties:
        id: {type: string}
        email: {type: string}
        role: {$ref: '#/components/schemas/MemberRole'}
        desiredAccess: {type: boolean}
        version: {type: integer}
        syncedVersion: {type: integer}
        updatedAt: {type: string, format: date-time}

    MemberRole:
      description: The role a managed member holds. Admin is never managed here.
      type: string
      enum: [player, tester]
