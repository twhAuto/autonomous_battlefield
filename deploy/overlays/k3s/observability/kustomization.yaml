apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../local/observability
patches:
  - target:
      kind: PersistentVolumeClaim
      name: battlefield-elasticsearch-data
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: battlefield-retained
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
