# Assembles the Envoy gateway class, proxy settings, listener, and
# application/observability hostname routes.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gateway-class.yaml
  - envoy-proxy.yaml
  - gateway.yaml
  - application-route.yaml
  - grafana-route.yaml
  - kibana-route.yaml
