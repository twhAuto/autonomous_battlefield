apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: battlefield-grafana
  namespace: battlefield
spec:
  parentRefs:
    - name: battlefield-local
  hostnames:
    - grafana.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: battlefield-grafana
          port: 3000
