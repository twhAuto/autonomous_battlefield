# Routes kibana.localhost traffic through the shared local gateway to Kibana.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: battlefield-kibana
  namespace: battlefield
spec:
  parentRefs:
    - name: battlefield-local
  hostnames:
    - kibana.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: battlefield-kibana
          port: 5601
