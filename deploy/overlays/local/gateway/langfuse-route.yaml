# Exposes Langfuse through the same gateway used by Grafana and Kibana.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: battlefield-langfuse
  namespace: battlefield
spec:
  parentRefs:
    - name: battlefield-local
  hostnames:
    - langfuse.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: langfuse-web
          port: 3000
