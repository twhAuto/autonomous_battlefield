# Adds local PostgreSQL and environment-file Secret generators to the base infrastructure;
# deployment tooling stages private inputs.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: battlefield

resources:
  - ../../../base/infrastructure
  - postgres-service.yaml
  - postgres-statefulset.yaml

secretGenerator:
  - name: battlefield-database
    envs:
      - secret.env
  - name: battlefield-ai
    envs:
      - ai-secret.env
  - name: battlefield-runtime
    envs:
      - runtime.env
  - name: battlefield-cache
    envs:
      - cache.env

generatorOptions:
  disableNameSuffixHash: true
