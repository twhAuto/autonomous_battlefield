apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: battlefield

resources:
  - ../../../base/infrastructure
  - postgres-service.yaml
  - postgres-statefulset.yaml

secretGenerator:
  - name: battlefield-database
    envs:
      - secret.env

generatorOptions:
  disableNameSuffixHash: true
