# Service identity used by kube-state-metrics to query Kubernetes through its role
# binding.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: battlefield-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: autonomous-battlefield
automountServiceAccountToken: true
