# Exposes Prometheus inside the cluster for its observability clients.

apiVersion: v1
kind: Service
metadata:
  name: battlefield-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: autonomous-battlefield
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
