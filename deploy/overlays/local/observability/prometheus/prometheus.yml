global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: battlefield-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - battlefield
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scrape
        action: keep
        regex: "true"
      - source_labels:
          - __meta_kubernetes_pod_phase
        action: keep
        regex: Running
      - source_labels:
          - __meta_kubernetes_pod_ip
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        separator: ":"
        target_label: __address__
        regex: "(.+):(.+)"
        replacement: "${1}:${2}"
      - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_path
        target_label: __metrics_path__
        regex: "(.+)"
      - source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_component
        target_label: component
      - source_labels:
          - __meta_kubernetes_pod_name
        target_label: scrape_pod

  - job_name: kubernetes-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    # kind's kubelet serving certificate is node-local rather than signed by
    # the Kubernetes API CA mounted in this Pod. This direct scrape is confined
    # to the disposable local cluster and still authenticates with the service
    # account token.
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_node_name
        target_label: node
