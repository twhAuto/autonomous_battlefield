# Assembles Tempo's local workload, service, and supporting resources for the
# observability overlay.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: battlefield-tempo-config
    files:
      - tempo.yaml

generatorOptions:
  disableNameSuffixHash: true
