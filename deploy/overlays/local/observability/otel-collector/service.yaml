# Exposes the OpenTelemetry Collector inside the cluster for its observability clients.

apiVersion: v1
kind: Service
metadata:
  name: battlefield-otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
