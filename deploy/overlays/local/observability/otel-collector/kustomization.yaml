# Assembles the OpenTelemetry Collector's local workload, service, and supporting
# resources for the observability overlay.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: battlefield-otel-collector-config
    files:
      - config.yaml

generatorOptions:
  disableNameSuffixHash: true
