# Assembles Grafana's local workload, service, and supporting resources for the
# observability overlay.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: battlefield-grafana-provisioning
    files:
      - datasources.yaml
      - dashboards.yaml
  - name: battlefield-grafana-dashboards
    files:
      - battlefield-overview.json
      - kubernetes-workloads.json
