# Exposes Grafana inside the cluster for its observability clients.

apiVersion: v1
kind: Service
metadata:
  name: battlefield-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: autonomous-battlefield
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
