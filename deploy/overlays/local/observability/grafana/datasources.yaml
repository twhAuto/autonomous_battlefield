# Provisions Grafana connections to Prometheus metrics and Tempo traces using in-cluster
# service names.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: battlefield-prometheus
    type: prometheus
    access: proxy
    url: http://battlefield-prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: battlefield-tempo
    type: tempo
    access: proxy
    url: http://battlefield-tempo:3200
    editable: false
    jsonData:
      # Tempo serves gRPC streaming on a separate port that is not exposed; query over
      # HTTP instead of retrying a stream that can never connect.
      streamingEnabled:
        search: false
        metrics: false
