# Assembles the local metrics, dashboards, logs, tracing, and collector-permission stack
# in the application namespace.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: battlefield

resources:
  - prometheus
  - kube-state-metrics
  - grafana
  - elasticsearch
  - kibana
  - collector-rbac
  - otel-collector
  - tempo
