apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: battlefield

resources:
  - prometheus-rbac.yaml
  - prometheus-deployment.yaml
  - prometheus-service.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml

configMapGenerator:
  - name: battlefield-prometheus-config
    files:
      - prometheus.yml
      - alerts.yml
  - name: battlefield-grafana-provisioning
    files:
      - datasources.yaml
      - dashboards.yaml
  - name: battlefield-grafana-dashboards
    files:
      - battlefield-overview.json
