apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: battlefield-fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: autonomous-battlefield
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: battlefield-fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: autonomous-battlefield
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: battlefield-fluent-bit
subjects:
  - kind: ServiceAccount
    name: battlefield-fluent-bit
    namespace: battlefield-logging
