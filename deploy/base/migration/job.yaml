# Runs the backend migration command against the configured database before application
# rollout.

apiVersion: batch/v1
kind: Job
metadata:
  name: battlefield-migrate
  labels:
    app.kubernetes.io/name: autonomous-battlefield
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autonomous-battlefield
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: autonomous-battlefield-backend:dev
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/battlefield/config.yaml
            - -migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: battlefield-database
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/battlefield/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: battlefield-config
