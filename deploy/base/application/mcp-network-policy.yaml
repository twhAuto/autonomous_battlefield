apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: battlefield-mcp-agent-only
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: autonomous-battlefield, app.kubernetes.io/component: mcp}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: autonomous-battlefield, app.kubernetes.io/component: agent}
      ports: [{protocol: TCP, port: 8084}]
