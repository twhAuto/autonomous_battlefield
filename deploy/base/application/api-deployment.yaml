# Runs replicated HTTP API pods with database/configuration mounts, process probes, and
# rollout/security settings.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: battlefield-api
  labels:
    app.kubernetes.io/name: autonomous-battlefield
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autonomous-battlefield
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autonomous-battlefield
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: autonomous-battlefield-backend:dev
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/battlefield/config.yaml
          envFrom:
            - secretRef:
                name: battlefield-auth
                optional: true
          env:
            - name: BATTLEFIELD_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: battlefield-cache
                  key: BATTLEFIELD_REDIS_URL
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://battlefield-otel-collector:4318
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: BATTLEFIELD_ENVIRONMENT
              value: local
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: battlefield-database
                  key: DATABASE_URL
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: battlefield-ai
                  key: OPENAI_MODEL
            - name: OPENAI_PROFILE_AVAILABLE
              valueFrom:
                secretKeyRef:
                  name: battlefield-ai
                  key: OPENAI_PROFILE_AVAILABLE
            - name: GEMINI_MODEL
              valueFrom:
                secretKeyRef:
                  name: battlefield-ai
                  key: GEMINI_MODEL
            - name: GEMINI_PROFILE_AVAILABLE
              valueFrom:
                secretKeyRef:
                  name: battlefield-ai
                  key: GEMINI_PROFILE_AVAILABLE
            - name: CODEX_CLI_PROFILE_AVAILABLE
              valueFrom:
                secretKeyRef:
                  name: battlefield-ai
                  key: CODEX_CLI_PROFILE_AVAILABLE
                  optional: true
            - name: GEMINI_CLI_PROFILE_AVAILABLE
              valueFrom:
                secretKeyRef:
                  name: battlefield-ai
                  key: GEMINI_CLI_PROFILE_AVAILABLE
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/battlefield/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: battlefield-config
