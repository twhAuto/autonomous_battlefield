# Base ingress routing for the API and frontend; the local overlay replaces it with
# Gateway API routes.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: battlefield
  labels:
    app.kubernetes.io/name: autonomous-battlefield
spec:
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: battlefield-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: battlefield-frontend
                port:
                  name: http
