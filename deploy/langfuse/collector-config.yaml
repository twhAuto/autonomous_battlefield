# Receives OTLP traces, applies memory/batch processing, and exports the trace pipeline to
# Tempo and the in-cluster Langfuse project. Selected with LANGFUSE_ENABLED=1.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
  batch: {}
  filter/langfuse:
    error_mode: ignore
    traces:
      span:
        - 'attributes["langfuse.observation.type"] == nil'

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: ${env:LANGFUSE_AUTHORIZATION}
      x-langfuse-ingestion-version: "4"
    timeout: 10s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 256
  otlp/tempo:
    endpoint: battlefield-tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    traces/langfuse:
      receivers: [otlp]
      processors: [memory_limiter, filter/langfuse, batch]
      exporters: [otlphttp/langfuse]
