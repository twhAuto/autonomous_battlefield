ai:
  environment: local
  agentConcurrency: 4
  agentHealthAddress: 127.0.0.1:8083
  mcpUrl: http://192.168.234.1:18084/mcp
  decisionTimeout: 2m
  profiles:
    - id: codex-subscription-local
      displayName: Codex subscription
      provider: codex-cli
      runtime: cli
      model: gpt-5.6-luna
      scope: local
      supportedVersionPrefix: codex-cli 0.152.
      maxSteps: 3
      enabled: true
    - id: claude-subscription-local
      displayName: Claude subscription
      provider: claude-cli
      runtime: cli
      model: sonnet
      scope: local
      supportedVersionPrefix: "2.1.267 "
      maxSteps: 3
      enabled: false
    - id: gemini-subscription-local
      displayName: Antigravity subscription
      provider: antigravity-cli
      runtime: cli
      model: gemini-3.7-flash-medium
      scope: local
      supportedVersionPrefix: 1.1.
      maxSteps: 3
      enabled: false
