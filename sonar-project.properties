sonar.projectKey=autonomous-battlefield
sonar.projectName=Autonomous Battlefield
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.test.inclusions=backend/**/*_test.go,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=backend/**/*_test.go,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
