# Default backend process settings: listeners, database access, battle timing, AI
# profiles, and background-generation limits. Secrets are read through named environment
# variables.

http:
  address: ":8080"
  readHeaderTimeout: 5s
  readTimeout: 10s
  writeTimeout: 10s
  idleTimeout: 60s
  shutdownTimeout: 10s
database:
  urlEnvironmentVariable: DATABASE_URL
  connectTimeout: 5s
  maxConnections: 10
  minConnections: 1
  maxConnectionLifetime: 30m
api:
  scenarioCatalogPath: scenarios
  rulesetCatalogPath: rulesets
  maxTicks: 10000
auth:
  enabledEnvironmentVariable: BATTLEFIELD_AUTH_ENABLED
  usernameEnvironmentVariable: BATTLEFIELD_ADMIN_USERNAME
  passwordEnvironmentVariable: BATTLEFIELD_ADMIN_PASSWORD
  sessionSecretEnvironmentVariable: BATTLEFIELD_SESSION_SECRET
  cookieSecureEnvironmentVariable: BATTLEFIELD_AUTH_COOKIE_SECURE
  sessionTTL: 12h
engine:
  healthAddress: ":8081"
  pollInterval: 1s
  leaseDuration: 30s
  heartbeatInterval: 10s
  shutdownTimeout: 10s
  maxAttempts: 3
  knowledgeRetrieval:
    maxUnitCards: 16
    maxBytes: 16384
  workerIdEnvironmentVariable: ENGINE_WORKER_ID
ai:
  backgroundGeneration:
    enabled: true
    profileId: codex-subscription-local
    dailyAllowance: 10
    cooldown: 30s
    queueTimeout: 5m
    executionTimeout: 2m
  environment: local
  agentHealthAddress: ":8083"
  mcpAddress: ":8084"
  mcpUrl: http://127.0.0.1:8084/mcp
  decisionTimeout: 2m
  capabilitySecretEnvironmentVariable: BATTLEFIELD_MCP_CAPABILITY_SECRET
  allowedOrigins:
    - http://127.0.0.1:8083
    - http://localhost:8083
  profiles:
    - id: openai-api-balanced
      displayName: OpenAI API
      provider: openai
      runtime: api
      modelEnvironmentVariable: OPENAI_MODEL
      credentialEnvironmentVariable: OPENAI_API_KEY
      availabilityEnvironmentVariable: OPENAI_PROFILE_AVAILABLE
      scope: cluster
      maxOutputTokens: 1200
      maxSteps: 3
      enabled: true
    - id: gemini-api-balanced
      displayName: Gemini API
      provider: gemini
      runtime: api
      modelEnvironmentVariable: GEMINI_MODEL
      credentialEnvironmentVariable: GEMINI_API_KEY
      availabilityEnvironmentVariable: GEMINI_PROFILE_AVAILABLE
      scope: cluster
      maxOutputTokens: 1200
      maxSteps: 3
      enabled: true
    - id: codex-subscription-local
      displayName: Codex / ChatGPT subscription
      provider: codex-cli
      runtime: cli
      model: gpt-5.6-luna
      scope: local
      supportedVersionPrefix: codex-cli 0.152.
      maxSteps: 3
      enabled: true
    - id: gemini-subscription-local
      displayName: Antigravity / Google subscription
      provider: antigravity-cli
      runtime: cli
      model: gemini-3.7-flash-medium
      scope: local
      supportedVersionPrefix: 1.1.
      maxSteps: 3
      enabled: true

# Optional API-only cache; an unset/empty URL disables Redis.
resultCache:
  urlEnvironmentVariable: BATTLEFIELD_REDIS_URL
  ttl: 1h
  timeout: 100ms
