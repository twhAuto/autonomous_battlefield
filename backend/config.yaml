# Default backend process settings: listeners, database access, battle timing, AI
# profiles, and background-generation limits. Secrets and URLs come from fixed environment
# variables listed in internal/config/environment.go.

http:
  address: "127.0.0.1:8080"
  readHeaderTimeout: 5s
  readTimeout: 10s
  writeTimeout: 10s
  idleTimeout: 60s
  shutdownTimeout: 10s
database:
  connectTimeout: 5s
  maxConnections: 10
  minConnections: 1
  maxConnectionLifetime: 30m
api:
  maxTicks: 10000
auth:
  sessionTTL: 12h
engine:
  healthAddress: "127.0.0.1:8081"
  pollInterval: 1s
  leaseDuration: 30s
  heartbeatInterval: 10s
  shutdownTimeout: 10s
  maxAttempts: 3
  concurrency: 4
  knowledgeRetrieval:
    maxUnitCards: 16
    maxBytes: 16384
ai:
  backgroundGeneration:
    enabled: true
    profileId: codex-subscription-local
    dailyAllowance: 10
    cooldown: 30s
    queueTimeout: 5m
    executionTimeout: 2m
  environment: local
  agentConcurrency: 4
  agentHealthAddress: "127.0.0.1:8083"
  aiGatewayAddress: "127.0.0.1:8084"
  mcpUrl: http://127.0.0.1:8084/mcp
  decisionTimeout: 3m
  allowedOrigins:
    - http://127.0.0.1:8083
    - http://localhost:8083
  profiles:
    - id: openai-api-balanced
      displayName: OpenAI API
      provider: openai
      runtime: api
      modelEnvironmentVariable: OPENAI_MODEL
      credentialEnvironmentVariable: OPENAI_API_KEY
      availabilityEnvironmentVariable: OPENAI_PROFILE_AVAILABLE
      modelOptions:
        - id: gpt-6.1-sol
          reasoningEfforts: [low, medium, high]
        - id: gpt-6.1-terra
          reasoningEfforts: [low, medium, high]
        - id: gpt-6-astra
          reasoningEfforts: [low, medium, high]
        - id: gpt-6-sol
          reasoningEfforts: [low, medium, high]
        - id: gpt-6-luna
          reasoningEfforts: [low, medium, high]
        - id: gpt-5.6-sol
          reasoningEfforts: [low, medium, high]
        - id: gpt-5.6-terra
          reasoningEfforts: [low, medium, high]
        - id: gpt-5.6-luna
          reasoningEfforts: [low, medium, high]
      scope: cluster
      # Reasoning tokens count against this ceiling; higher efforts can exhaust
      # 1200 before a required function call is emitted.
      maxOutputTokens: 4096
      maxSteps: 5
      enabled: true
    - id: gemini-api-balanced
      displayName: Gemini API
      provider: gemini
      runtime: api
      modelEnvironmentVariable: GEMINI_MODEL
      credentialEnvironmentVariable: GEMINI_API_KEY
      availabilityEnvironmentVariable: GEMINI_PROFILE_AVAILABLE
      modelOptions:
        - id: gemini-3.8-flash
          reasoningEfforts: [low, medium, high]
      scope: cluster
      # Gemini reasoning tokens count against this ceiling; 1200 can be
      # exhausted before a required function call is emitted.
      maxOutputTokens: 4096
      maxSteps: 5
      enabled: true
    - id: claude-api-balanced
      displayName: Claude API
      provider: anthropic
      runtime: api
      modelEnvironmentVariable: ANTHROPIC_MODEL
      credentialEnvironmentVariable: ANTHROPIC_API_KEY
      availabilityEnvironmentVariable: ANTHROPIC_PROFILE_AVAILABLE
      modelOptions:
        - id: claude-haiku-5-5
          reasoningEfforts: [low, medium, high]
        - id: claude-sonnet-5-5
          reasoningEfforts: [low, medium, high]
        - id: claude-opus-5-5
          reasoningEfforts: [low, medium, high]
        - id: claude-fable-5-1
          reasoningEfforts: [low, medium, high]
      scope: cluster
      # Claude thinking cannot be turned off and counts against this ceiling.
      maxOutputTokens: 16000
      maxSteps: 5
      enabled: true
    - id: codex-subscription-local
      displayName: Codex / ChatGPT subscription
      provider: codex-cli
      runtime: cli
      model: gpt-5.6-luna
      modelOptions:
        - id: gpt-6.1-sol
          reasoningEfforts: [low, medium, high]
        - id: gpt-6.1-terra
          reasoningEfforts: [low, medium, high]
        - id: gpt-6-astra
          reasoningEfforts: [low, medium, high]
        - id: gpt-6-sol
          reasoningEfforts: [low, medium, high]
        - id: gpt-6-luna
          reasoningEfforts: [low, medium, high]
        - id: gpt-5.6-sol
          reasoningEfforts: [low, medium, high]
        - id: gpt-5.6-terra
          reasoningEfforts: [low, medium, high]
        - id: gpt-5.6-luna
          reasoningEfforts: [low, medium, high]
      scope: local
      supportedVersionPrefix: codex-cli 0.159.
      availabilityEnvironmentVariable: CODEX_CLI_PROFILE_AVAILABLE
      maxSteps: 3
      enabled: true
    - id: claude-subscription-local
      displayName: Claude subscription
      provider: claude-cli
      runtime: cli
      model: sonnet
      modelOptions:
        - id: haiku
          reasoningEfforts: [low, medium, high]
        - id: sonnet
          reasoningEfforts: [low, medium, high]
        - id: opus
          reasoningEfforts: [low, medium, high]
        - id: fable
          reasoningEfforts: [low, medium, high]
      scope: local
      supportedVersionPrefix: "2.1.325 "
      availabilityEnvironmentVariable: CLAUDE_CLI_PROFILE_AVAILABLE
      maxSteps: 3
      enabled: true
    - id: gemini-subscription-local
      displayName: Antigravity / Google subscription
      provider: antigravity-cli
      runtime: cli
      model: gemini-3.8-flash-medium
      modelOptions:
        - id: gemini-4-argon-low
        - id: gemini-4-argon-medium
        - id: gemini-4-argon-high
        - id: gemini-4-hydrogen-low
        - id: gemini-4-hydrogen-medium
        - id: gemini-4-hydrogen-high
        - id: gemini-4-hydrogen-xhigh
        - id: gemini-3.8-flash-low
        - id: gemini-3.8-flash-medium
        - id: gemini-3.8-flash-high
      scope: local
      supportedVersionPrefix: 1.5.
      availabilityEnvironmentVariable: GEMINI_CLI_PROFILE_AVAILABLE
      maxSteps: 3
      enabled: true

# Optional API-only cache; an unset/empty URL disables Redis.
resultCache:
  ttl: 1h
  timeout: 100ms
