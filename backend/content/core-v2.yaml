knowledge:
  mechanics: >-
    Range limits attack distance; movement limits travel per movement action.
    Defense reduces damage subject to the minimum damage rule. Unit actions and targeting
    are executed by the engine; a plan sets faction priorities, not individual commands.
    Siege units prefer defense towers, other structures, then castles; their damage bonus
    applies before defense. Catapults retreat from adjacent enemies when possible and cannot
    attack them. Pikemen gain 12 attack against mobile troops such as Strikers.
    Herbalists treat one adjacent soldier for 3 HP instead of attacking; they cannot treat
    siege engines or other healers and follow injured allies or escort soldiers.
    Defense towers fire before units; newly built towers and Barracks become active next tick; watchtower vision is immediate.
    Watchtowers extend vision without attacking.
    Barracks recruit from adjacent free ground. A forward source reduces travel time
    but exposes the investment. Every construction site has a protected ground approach;
    stone ridges allow movement around their ends and do not block ranged fire or vision.
  cards:
    - unitId: vanguard
      role: Durable melee unit
      strengths: Higher base health and defense than other starters.
      weaknesses: Less movement and attack than Striker; higher cost.
      guidance: Consider when durability matters, while accounting for travel time and budget.
    - unitId: striker
      role: Mobile melee attacker
      strengths: Higher base attack and movement than other starters.
      weaknesses: Less health and defense than Vanguard; melee range.
      guidance: Consider for mobile pressure, but assess exposure using visible enemy positions.
    - unitId: ranger
      role: Ranged attacker and observer
      strengths: Longer range and vision than other starters.
      weaknesses: Lower health and defense than other starters.
      guidance: Consider reach and visibility; do not assume a guaranteed counter or manual positioning.

    - unitId: catapult
      role: Long-range building siege
      strengths: Outranges towers; +20 attack against buildings.
      weaknesses: Fragile, slow, costly; cannot attack adjacent enemies.
      guidance: Mix with troops to protect its approach; it prioritizes reachable enemy structures.
    - unitId: battering_ram
      role: Armored melee siege
      strengths: High health; +25 attack against buildings.
      weaknesses: Slow; weak against soldiers.
      guidance: Recruit with fighting escorts; it must reach adjacent ground to breach a structure.
    - unitId: pikeman
      role: Anti-mobile infantry
      strengths: +12 attack against mobile units, including Strikers.
      weaknesses: Slow, melee; exposed to Rangers.
      guidance: Include against mobile pressure; escorts are autonomous and formations are not commanded.
    - unitId: herbalist
      role: Field treatment support
      strengths: Heals adjacent injured soldiers 3 HP/action; follows allies.
      weaknesses: Cannot attack or heal itself, healers, siege or structures.
      guidance: Buy alongside combat troops; healing replaces movement and does not scale with arsenal.
