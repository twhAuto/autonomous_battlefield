services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: battlefield
      POSTGRES_USER: battlefield
      POSTGRES_PASSWORD: battlefield
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battlefield -d battlefield"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - battlefield-postgres:/var/lib/postgresql/data

  dbhub:
    image: bytebase/dbhub:latest
    profiles:
      - tools
    init: true
    ports:
      - "127.0.0.1:8082:8080"
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --dsn
      - postgres://battlefield:battlefield@postgres:5432/battlefield?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  battlefield-postgres:
