knowledge:
  mechanics: >-
    Every map shares this full roster and upgrade catalog. Specialist upgrades cost 480 gold;
    choose only one per exclusiveGroup for the battle. They affect existing and future matching
    units and stack with the three general upgrade levels. Vanguard chooses defense or attack;
    Ranger chooses range or movement; Herbalist chooses treatment amount or range;
    siege chooses movement or building damage. Choices cannot be reversed or refunded.
    Scouts retreat from enemies within two hexes when a safer reachable position exists.
    Crossbowman armor piercing ignores up to 6 unit defense, never buildings.
    Engineers repair one adjacent damaged friendly siege engine or non-castle building for
    four HP, spending two gold and one of twelve lifetime charges; they do not attack.
    Adjacent enemies interrupt repairs. Repairs respect reserveGold, cannot revive targets,
    and never exceed maximum health. Engineers follow damaged targets or allied siege.
    Arsenal, Plating and Industry each have three sequential levels.
    Each level adds another 2 to its effect, for cumulative bonuses of 2, 4 and 6.
    Level III is the cap. Buy prerequisites first; multiple levels can be bought in one window.
    Defense reduces damage subject to the minimum damage rule. Unit actions and targeting
    are executed by the engine; a plan sets faction priorities, not individual commands.
    Siege units prefer defense towers, other structures, then castles; their damage bonus
    applies before defense. Catapults and Cannons retreat from adjacent enemies when possible and
    cannot attack them. Position attacks strike the hex aimed at when the tick starts and miss
    targets that moved away.
    Castles and defense towers fire before units; newly built towers and training buildings become active next tick; outposts extend territory.
    Late-game types are locked until their unlock upgrade is owned: Gunpowder (1000 gold) unlocks
    Cannon and Gunner; Knighthood (800 gold) unlocks Heavy Cavalry. A plan may select a locked
    type only if it owns or orders the unlock; production waits without charge until it is owned.
    Each faction starts with only its castle, which attacks and also trains the Barracks roster. Castles and Barracks train Vanguard, Striker and Pikeman; Archery Ranges train Ranger, Crossbowman and Gunner; Stables train Scout, Raider Cavalry and Heavy Cavalry; Siege Workshops train Catapult, Battering Ram, Engineer and Cannon; Infirmaries train Herbalist. AI selects one unitType per building with productionOrders and enabled true. The building continuously trains that type one at a time using trainingTicks. Settings persist between decisions; omitted buildings keep their settings. Changing type affects only the next unit. Turning enabled false lets the paid unit finish, then stops new training. Ready units wait if every adjacent traversable hex is occupied. Each new unit costs gold when training starts. Insufficient gold above reserveGold pauses new training until affordable; enabled stays true. A blocked exit stops purchases. Income, construction and upgrades run before automatic purchases, which occur in building ID order. Extra training buildings add simultaneous production; spend gold rather than idling a treasury. New units act the tick after deployment. A forward source reduces travel time
    but exposes the investment. Buildings need clear ground in your territory (within buildRange of an active friendly building) and outside enemy territory: overlapping ground is contested and closed to both sides until buildings fall. Economy buildings need a gold mine (gold deposit) with gold left, which no other building may take. A mine holds finite gold: its economy building draws all its income, Industry and the +5 mine bonus included, from it until empty, then earns nothing; a destroyed one leaves the rest for either side. Buildings must be at least two hexes apart and never beside a mine with gold left; units block construction. Forests are traversable and grant troops +3 defense after armor piercing, but prohibit construction. Rocks are impassable. The whole battlefield is visible (no fog of war).
  cards:
    - unitId: vanguard
      role: Durable melee unit
      strengths: Higher base health and defense than other starters.
      weaknesses: Less movement and attack than Striker; higher cost.
      guidance: Consider when durability matters, while accounting for travel time and budget.
    - unitId: striker
      role: Mobile melee attacker
      strengths: Higher base attack and movement than other starters.
      weaknesses: Less health and defense than Vanguard; melee range.
      guidance: Consider for mobile pressure, but assess exposure using visible enemy positions.
    - unitId: ranger
      role: Ranged attacker
      strengths: Longer attack range than other starters.
      weaknesses: Lower health and defense than other starters.
      guidance: Consider reach and positioning; do not assume a guaranteed counter or manual positioning.

    - unitId: catapult
      role: Long-range building siege
      strengths: Outranges towers; +20 attack against buildings.
      weaknesses: Fragile, slow, costly; cannot attack adjacent enemies.
      guidance: Mix with troops to protect its approach; it prioritizes reachable enemy structures.
    - unitId: battering_ram
      role: Armored melee siege
      strengths: High health; +25 attack against buildings.
      weaknesses: Slow; weak against soldiers.
      guidance: Recruit with fighting escorts; it must reach adjacent ground to breach a structure.
    - unitId: pikeman
      role: Anti-mobile infantry
      strengths: +12 attack against mobile units, including Strikers.
      weaknesses: Slow, melee; exposed to Rangers.
      guidance: Include against mobile pressure; escorts are autonomous and formations are not commanded.
    - unitId: herbalist
      role: Field treatment support
      strengths: Heals adjacent injured soldiers 3 HP/action; follows allies.
      weaknesses: Cannot attack or heal itself, healers, siege or structures.
      guidance: Buy alongside combat troops; healing replaces movement and does not scale with arsenal.

    - unitId: scout
      role: Fast skirmisher
      strengths: Movement 3 and training time 2 enable fast deployment; retreats from nearby enemies.
      weaknesses: Low health, attack and defense; vulnerable when escape routes are blocked.
      guidance: Use for mobile harassment alongside combat troops; a Scout does not win a frontline fight.
    - unitId: raider_cavalry
      role: Mobile siege hunter
      strengths: Prefers siege targets; +16 attack against siege engines, with movement 3.
      weaknesses: Pikemen counter mobile class; fragile against screened frontline troops.
      guidance: Use to punish exposed siege; it pursues reachable siege across the battlefield.
    - unitId: engineer
      role: Bounded field repair support
      strengths: Repairs siege engines and non-castle buildings for 4 HP per action.
      weaknesses: Cannot attack; 12 lifetime repairs cost 2 gold each; adjacent enemies interrupt.
      guidance: Escort siege with repair support; protect reserve gold and do not expect castle repairs.
    - unitId: crossbowman
      role: Armor-piercing short-range infantry
      strengths: Ignores up to 6 unit defense; attack 13.
      weaknesses: Range 2, low health and movement 1; outranged by Rangers and vulnerable to raids.
      guidance: Counter defended infantry; armor penetration does not apply to buildings.

    - unitId: cannon
      role: Late-game long-range siege artillery
      strengths: Range 6 outranges castles, towers and Catapults; +36 attack against buildings.
      weaknesses: Requires Gunpowder; costly, slow, fires at a hex and cannot attack adjacent enemies.
      guidance: Use to break fortified lines and castles in a stalemate; screen it from Raider Cavalry.
    - unitId: gunner
      role: Late-game heavy-hitting ranged infantry
      strengths: Attack 24 at range 2, the highest of any troop against units and buildings.
      weaknesses: Requires Gunpowder; costly, fragile and slow; defense still reduces its damage; volleys miss targets that move away; outranged by Rangers.
      guidance: Use behind a frontline to wear down heavily plated infantry and Heavy Cavalry that Rangers barely scratch.
    - unitId: heavy_cavalry
      role: Late-game shock cavalry
      strengths: High health, attack and defense with movement 2; +8 attack against infantry.
      weaknesses: Requires Knighthood; expensive and slow to train; Pikemen gain +12 against it; Gunners hit it hard from range.
      guidance: Use to break infantry lines; it turns surplus gold into more strength per unit slot.
