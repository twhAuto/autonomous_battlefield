# Local PostgreSQL with persistent storage, an optional disposable Redis cache, and an
# optional DBHub database browser. Application processes are started separately.

# Preserve the standalone stack's existing Compose project and volume identity.
name: backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: battlefield
      POSTGRES_USER: battlefield
      POSTGRES_PASSWORD: ${BATTLEFIELD_POSTGRES_PASSWORD:?Set BATTLEFIELD_POSTGRES_PASSWORD in infra/local/.env or the shell}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battlefield -d battlefield"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - battlefield-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    profiles: [cache]
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  dbhub:
    image: bytebase/dbhub:1.5.0
    profiles:
      - tools
    init: true
    ports:
      - "127.0.0.1:8082:8080"
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --dsn
      - postgres://battlefield:${BATTLEFIELD_POSTGRES_PASSWORD:?Set BATTLEFIELD_POSTGRES_PASSWORD in infra/local/.env or the shell}@postgres:5432/battlefield?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  battlefield-postgres:
