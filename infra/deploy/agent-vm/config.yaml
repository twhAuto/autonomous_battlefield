ai:
  environment: local
  agentConcurrency: 4
  agentHealthAddress: 127.0.0.1:8083
  mcpUrl: http://192.168.234.1:18084/mcp
  decisionTimeout: 3m
  profiles:
    - id: codex-subscription-local
      displayName: Codex subscription
      provider: codex-cli
      runtime: cli
      model: gpt-5.6-luna
      modelOptions:
        - id: gpt-6.1-sol
          reasoningEfforts: [low, medium, high]
        - id: gpt-6.1-terra
          reasoningEfforts: [low, medium, high]
        - id: gpt-6-astra
          reasoningEfforts: [low, medium, high]
        - id: gpt-6-sol
          reasoningEfforts: [low, medium, high]
        - id: gpt-6-luna
          reasoningEfforts: [low, medium, high]
        - id: gpt-5.6-sol
          reasoningEfforts: [low, medium, high]
        - id: gpt-5.6-terra
          reasoningEfforts: [low, medium, high]
        - id: gpt-5.6-luna
          reasoningEfforts: [low, medium, high]
      scope: local
      supportedVersionPrefix: codex-cli 0.159.
      maxSteps: 3
      enabled: true
    - id: claude-subscription-local
      displayName: Claude subscription
      provider: claude-cli
      runtime: cli
      model: sonnet
      modelOptions:
        - id: haiku
          reasoningEfforts: [low, medium, high]
        - id: sonnet
          reasoningEfforts: [low, medium, high]
        - id: opus
          reasoningEfforts: [low, medium, high]
        - id: fable
          reasoningEfforts: [low, medium, high]
      scope: local
      supportedVersionPrefix: "2.1.325 "
      maxSteps: 3
      enabled: false
    - id: gemini-subscription-local
      displayName: Antigravity subscription
      provider: antigravity-cli
      runtime: cli
      model: gemini-3.8-flash-medium
      modelOptions:
        - id: gemini-4-argon-low
        - id: gemini-4-argon-medium
        - id: gemini-4-argon-high
        - id: gemini-4-hydrogen-low
        - id: gemini-4-hydrogen-medium
        - id: gemini-4-hydrogen-high
        - id: gemini-4-hydrogen-xhigh
        - id: gemini-3.8-flash-low
        - id: gemini-3.8-flash-medium
        - id: gemini-3.8-flash-high
      scope: local
      supportedVersionPrefix: 1.2.
      maxSteps: 3
      enabled: false
