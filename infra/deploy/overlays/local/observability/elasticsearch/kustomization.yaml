# Assembles Elasticsearch's local workload, service, and supporting resources for the
# observability overlay.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml

configMapGenerator:
  - name: battlefield-elasticsearch-config
    files:
      - elasticsearch.yml
