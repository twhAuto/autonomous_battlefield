# Waits for Kibana and installs the log-view saved objects used to inspect battlefield
# logs.

apiVersion: batch/v1
kind: Job
metadata:
  name: battlefield-kibana-setup
  labels:
    app.kubernetes.io/name: kibana-setup
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: autonomous-battlefield
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana-setup
        app.kubernetes.io/component: logging
        app.kubernetes.io/part-of: autonomous-battlefield
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-data-view
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              echo "Waiting for Kibana API..."
              until curl --connect-timeout 5 --max-time 10 --fail --silent http://battlefield-kibana:5601/api/status >/dev/null; do
                sleep 2
              done
              curl --connect-timeout 5 --max-time 30 --fail-with-body --silent --show-error \
                --request POST \
                --header 'Content-Type: application/json' \
                --header 'kbn-xsrf: battlefield-kibana-setup' \
                --data '{"data_view":{"id":"battlefield-logs","name":"Autonomous Battlefield Logs","title":"battlefield-app-*","timeFieldName":"@timestamp","allowNoIndex":true},"override":true}' \
                http://battlefield-kibana:5601/api/data_views/data_view
              curl --connect-timeout 5 --max-time 30 --fail-with-body --silent --show-error \
                --request POST \
                --header 'Content-Type: application/json' \
                --header 'kbn-xsrf: battlefield-kibana-setup' \
                --data '{"data_view_id":"battlefield-logs","force":true}' \
                http://battlefield-kibana:5601/api/data_views/default
              curl --connect-timeout 5 --max-time 30 --fail-with-body --silent --show-error \
                --request POST \
                --header 'Content-Type: application/json' \
                --header 'kbn-xsrf: battlefield-kibana-setup' \
                --data '{"attributes":{"title":"Battlefield AI Decisions","description":"Decision claims, MCP tool calls, accepted plans, timeouts, and fallback outcomes.","columns":["@timestamp","msg"],"sort":[["@timestamp","desc"]],"grid":{},"hideChart":false,"isTextBasedQuery":false,"kibanaSavedObjectMeta":{"searchSourceJSON":"{\"query\":{\"query\":\"event: decision_* OR msg: decision_*\",\"language\":\"kuery\"},\"filter\":[]}"}},"references":[{"name":"kibanaSavedObjectMeta.searchSourceJSON.index","type":"index-pattern","id":"battlefield-logs"}]}' \
                'http://battlefield-kibana:5601/api/saved_objects/search/battlefield-ai-decisions?overwrite=true'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
