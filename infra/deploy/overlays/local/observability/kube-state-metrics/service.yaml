# Exposes kube-state-metrics inside the cluster for its observability clients.

apiVersion: v1
kind: Service
metadata:
  name: battlefield-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: autonomous-battlefield
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
