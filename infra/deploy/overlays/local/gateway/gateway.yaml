# Defines the shared local HTTP gateway and allows routes from its namespace to attach.

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: battlefield-local
  namespace: battlefield
spec:
  gatewayClassName: battlefield-local
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: battlefield-local-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
