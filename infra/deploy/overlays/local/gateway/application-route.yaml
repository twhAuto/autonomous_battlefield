# Routes battlefield.localhost API paths to the backend and remaining paths to the
# frontend through the shared gateway.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: battlefield-application
  namespace: battlefield
spec:
  parentRefs:
    - name: battlefield-local
  hostnames:
    - battlefield.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: battlefield-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: battlefield-frontend
          port: 8080
