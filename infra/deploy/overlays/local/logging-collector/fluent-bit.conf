# Fluent Bit pipeline for tailing container logs, enriching Kubernetes metadata, and
# sending records to Elasticsearch.

[SERVICE]
    Flush             1
    Grace             30
    Log_Level         info
    Parsers_File      parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    Health_Check      On

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/battlefield-api-*_battlefield_api-*.log,/var/log/containers/battlefield-engine-*_battlefield_engine-*.log,/var/log/containers/battlefield-agent-*_battlefield_agent-*.log,/var/log/containers/battlefield-mcp-*_battlefield_mcp-*.log,/var/log/containers/battlefield-frontend-*_battlefield_frontend-*.log,/var/log/containers/battlefield-migrate-*_battlefield_migrate-*.log
    DB                /fluent-bit/state/tail.db
    Multiline.Parser  docker, cri
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

[FILTER]
    Name              kubernetes
    Match             kube.*
    Kube_URL          https://kubernetes.default.svc:443
    Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix   kube.var.log.containers.
    Merge_Log         On
    Keep_Log          Off
    Labels            On
    Annotations       Off

[OUTPUT]
    Name              es
    Match             kube.*
    Host              battlefield-elasticsearch.battlefield.svc.cluster.local
    Port              9200
    Logstash_Format   On
    Logstash_Prefix   battlefield-app
    Suppress_Type_Name On
    Generate_ID       On
    Retry_Limit       False
    Trace_Error       On
