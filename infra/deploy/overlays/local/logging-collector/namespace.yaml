# Dedicated namespace permitting the host access needed for node log collection while
# retaining restricted audit/warning labels.

apiVersion: v1
kind: Namespace
metadata:
  name: battlefield-logging
  labels:
    app.kubernetes.io/part-of: autonomous-battlefield
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
