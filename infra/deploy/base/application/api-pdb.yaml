# Keeps at least one API pod available during voluntary Kubernetes disruptions.

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: battlefield-api
  labels:
    app.kubernetes.io/name: autonomous-battlefield
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autonomous-battlefield
      app.kubernetes.io/component: api
