# Stable in-cluster endpoint used by agents to reach MCP tools and job-control routes.

apiVersion: v1
kind: Service
metadata:
  name: battlefield-mcp
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: autonomous-battlefield, app.kubernetes.io/component: mcp}
  ports: [{name: http, port: 8084, targetPort: http}]
