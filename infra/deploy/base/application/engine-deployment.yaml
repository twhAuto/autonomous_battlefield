# Runs the durable battle simulation worker with database access, lifecycle probes, and
# graceful shutdown settings.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: battlefield-engine
  labels:
    app.kubernetes.io/name: autonomous-battlefield
    app.kubernetes.io/component: engine
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: autonomous-battlefield
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autonomous-battlefield
        app.kubernetes.io/component: engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: autonomous-battlefield-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - /app/engine
          args:
            - -config
            - /etc/battlefield/config.yaml
          envFrom:
            - secretRef:
                name: battlefield-runtime
          env:
            - {name: BATTLEFIELD_ENVIRONMENT, value: production}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: battlefield-database
                  key: DATABASE_URL
            - name: ENGINE_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: operations
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /startupz
              port: operations
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: operations
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: operations
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/battlefield/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: battlefield-config
