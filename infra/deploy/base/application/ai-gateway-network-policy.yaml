# Limits incoming AI gateway pod traffic to matching agent pods where the cluster network
# enforces NetworkPolicy.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: battlefield-ai-gateway-agent-only
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: autonomous-battlefield, app.kubernetes.io/component: ai-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: autonomous-battlefield, app.kubernetes.io/component: agent}
      ports: [{protocol: TCP, port: 8084}]
