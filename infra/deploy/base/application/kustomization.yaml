# Assembles application deployments, services, routing, scaling, and disruption policies
# in the battlefield namespace.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: battlefield

resources:
  - api-deployment.yaml
  - api-service.yaml
  - engine-deployment.yaml
  - agent-deployment.yaml
  - ai-gateway-deployment.yaml
  - ai-gateway-service.yaml
  - ai-gateway-network-policy.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - frontend-pdb.yaml
