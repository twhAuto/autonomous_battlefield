# Provides a stable in-cluster endpoint for HTTP API pods selected by
# application/component labels.

apiVersion: v1
kind: Service
metadata:
  name: battlefield-api
  labels:
    app.kubernetes.io/name: autonomous-battlefield
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autonomous-battlefield
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
