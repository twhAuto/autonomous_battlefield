# Stable in-cluster endpoint used by agents to reach the AI gateway's MCP tools and
# dispatch routes.

apiVersion: v1
kind: Service
metadata:
  name: battlefield-ai-gateway
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: autonomous-battlefield, app.kubernetes.io/component: ai-gateway}
  ports: [{name: http, port: 8084, targetPort: http}]
---
# Pre-rename alias. The CLI host bridge still port-forwards service/battlefield-mcp
# until its units are renamed and re-applied; remove this alias after that.
apiVersion: v1
kind: Service
metadata:
  name: battlefield-mcp
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: autonomous-battlefield, app.kubernetes.io/component: ai-gateway}
  ports: [{name: http, port: 8084, targetPort: http}]
