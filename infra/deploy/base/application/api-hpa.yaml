# Scales API replicas from resource utilization while bounding the permitted replica
# count.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: battlefield-api
  labels:
    app.kubernetes.io/name: autonomous-battlefield
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: battlefield-api
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
