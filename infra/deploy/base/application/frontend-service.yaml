# Provides a stable in-cluster HTTP endpoint for the frontend Nginx pods.

apiVersion: v1
kind: Service
metadata:
  name: battlefield-frontend
  labels:
    app.kubernetes.io/name: autonomous-battlefield
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: autonomous-battlefield
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
