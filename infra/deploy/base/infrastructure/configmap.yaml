# Shared non-secret backend YAML mounted into application pods; credential values are
# supplied separately through Secrets.

apiVersion: v1
kind: ConfigMap
metadata:
  name: battlefield-config
data:
  config.yaml: |
    http:
      address: ":8080"
      readHeaderTimeout: 5s
      readTimeout: 10s
      writeTimeout: 10s
      idleTimeout: 60s
      shutdownTimeout: 10s
    database:
      urlEnvironmentVariable: DATABASE_URL
      connectTimeout: 5s
      maxConnections: 10
      minConnections: 1
      maxConnectionLifetime: 30m
    api:
      scenarioCatalogPath: /app/scenarios
      rulesetCatalogPath: /app/rulesets
      maxTicks: 10000
    auth:
      enabledEnvironmentVariable: BATTLEFIELD_AUTH_ENABLED
      usernameEnvironmentVariable: BATTLEFIELD_ADMIN_USERNAME
      passwordEnvironmentVariable: BATTLEFIELD_ADMIN_PASSWORD
      sessionSecretEnvironmentVariable: BATTLEFIELD_SESSION_SECRET
      cookieSecureEnvironmentVariable: BATTLEFIELD_AUTH_COOKIE_SECURE
      sessionTTL: 12h
    engine:
      healthAddress: ":8081"
      pollInterval: 1s
      leaseDuration: 30s
      heartbeatInterval: 10s
      shutdownTimeout: 10s
      maxAttempts: 3
      knowledgeRetrieval:
        maxUnitCards: 16
        maxBytes: 16384
      workerIdEnvironmentVariable: ENGINE_WORKER_ID
    ai:
      backgroundGeneration:
        enabled: true
        profileId: codex-subscription-local
        dailyAllowance: 10
        cooldown: 30s
        queueTimeout: 5m
        executionTimeout: 2m
      environment: cluster
      agentConcurrency: 4
      agentHealthAddress: ":8083"
      # Legacy key for aiGatewayAddress. Older rollback targets reject unknown keys,
      # so switch only after none predate the rename.
      mcpAddress: ":8084"
      mcpUrl: http://battlefield-ai-gateway:8084/mcp
      decisionTimeout: 2m
      capabilitySecretEnvironmentVariable: BATTLEFIELD_MCP_CAPABILITY_SECRET
      allowedOrigins: []
      profiles:
        - id: openai-api-balanced
          displayName: OpenAI API
          provider: openai
          runtime: api
          modelEnvironmentVariable: OPENAI_MODEL
          credentialEnvironmentVariable: OPENAI_API_KEY
          availabilityEnvironmentVariable: OPENAI_PROFILE_AVAILABLE
          scope: cluster
          maxOutputTokens: 1200
          maxSteps: 3
          enabled: true
        - id: gemini-api-balanced
          displayName: Gemini API
          provider: gemini
          runtime: api
          modelEnvironmentVariable: GEMINI_MODEL
          credentialEnvironmentVariable: GEMINI_API_KEY
          availabilityEnvironmentVariable: GEMINI_PROFILE_AVAILABLE
          scope: cluster
          # Gemini reasoning tokens count against this ceiling; 1200 can be
          # exhausted before a required function call is emitted.
          maxOutputTokens: 4096
          maxSteps: 3
          enabled: true
        - id: codex-subscription-local
          displayName: Codex / ChatGPT subscription
          provider: codex-cli
          runtime: cli
          model: gpt-5.6-luna
          availabilityEnvironmentVariable: CODEX_CLI_PROFILE_AVAILABLE
          supportedVersionPrefix: codex-cli 0.155.
          scope: local
          maxSteps: 3
          enabled: true
        - id: claude-subscription-local
          displayName: Claude subscription
          provider: claude-cli
          runtime: cli
          model: sonnet
          scope: local
          supportedVersionPrefix: "2.1.267 "
          availabilityEnvironmentVariable: CLAUDE_CLI_PROFILE_AVAILABLE
          maxSteps: 3
          enabled: true
        - id: gemini-subscription-local
          displayName: Antigravity / Google subscription
          provider: antigravity-cli
          runtime: cli
          model: gemini-3.7-flash-medium
          availabilityEnvironmentVariable: GEMINI_CLI_PROFILE_AVAILABLE
          supportedVersionPrefix: 1.2.
          scope: local
          maxSteps: 3
          enabled: true
