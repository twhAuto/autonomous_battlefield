# Shared non-secret backend YAML mounted into application pods; credential values are
# supplied separately through Secrets.

apiVersion: v1
kind: ConfigMap
metadata:
  name: battlefield-config
data:
  config.yaml: |
    # The *EnvironmentVariable keys are retired; older rollback targets still require
    # some of them. Current binaries accept each only with the fixed name shown, so
    # remove them once no rollback target predates the change.
    http:
      address: ":8080"
      readHeaderTimeout: 5s
      readTimeout: 10s
      writeTimeout: 10s
      idleTimeout: 60s
      shutdownTimeout: 10s
    database:
      urlEnvironmentVariable: DATABASE_URL
      connectTimeout: 5s
      maxConnections: 10
      minConnections: 1
      maxConnectionLifetime: 30m
    api:
      # Retired: game content is embedded in current images. Older rollback targets
      # read it from these paths; current binaries accept only these values.
      scenarioCatalogPath: /app/scenarios
      rulesetCatalogPath: /app/rulesets
      maxTicks: 10000
    auth:
      enabledEnvironmentVariable: BATTLEFIELD_AUTH_ENABLED
      usernameEnvironmentVariable: BATTLEFIELD_ADMIN_USERNAME
      passwordEnvironmentVariable: BATTLEFIELD_ADMIN_PASSWORD
      sessionSecretEnvironmentVariable: BATTLEFIELD_SESSION_SECRET
      cookieSecureEnvironmentVariable: BATTLEFIELD_AUTH_COOKIE_SECURE
      sessionTTL: 12h
    engine:
      healthAddress: ":8081"
      pollInterval: 1s
      leaseDuration: 30s
      heartbeatInterval: 10s
      shutdownTimeout: 10s
      maxAttempts: 3
      knowledgeRetrieval:
        maxUnitCards: 16
        maxBytes: 16384
      workerIdEnvironmentVariable: ENGINE_WORKER_ID
    ai:
      backgroundGeneration:
        enabled: true
        profileId: codex-subscription-local
        dailyAllowance: 10
        cooldown: 30s
        queueTimeout: 5m
        executionTimeout: 2m
      environment: cluster
      agentConcurrency: 4
      agentHealthAddress: ":8083"
      # Legacy key for aiGatewayAddress. Older rollback targets reject unknown keys,
      # so switch only after none predate the rename.
      mcpAddress: ":8084"
      # The pre-rename alias Service keeps serving the legacy gateway until the new one
      # is ready; switch to battlefield-ai-gateway when the alias is retired.
      mcpUrl: http://battlefield-mcp:8084/mcp
      decisionTimeout: 3m
      capabilitySecretEnvironmentVariable: BATTLEFIELD_MCP_CAPABILITY_SECRET
      allowedOrigins: []
      profiles:
        - id: openai-api-balanced
          displayName: OpenAI API
          provider: openai
          runtime: api
          modelEnvironmentVariable: OPENAI_MODEL
          credentialEnvironmentVariable: OPENAI_API_KEY
          availabilityEnvironmentVariable: OPENAI_PROFILE_AVAILABLE
          modelOptions:
            - id: gpt-6.1-sol
              reasoningEfforts: [low, medium, high]
            - id: gpt-6.1-terra
              reasoningEfforts: [low, medium, high]
            - id: gpt-6-astra
              reasoningEfforts: [low, medium, high]
            - id: gpt-6-sol
              reasoningEfforts: [low, medium, high]
            - id: gpt-6-luna
              reasoningEfforts: [low, medium, high]
            - id: gpt-5.6-sol
              reasoningEfforts: [low, medium, high]
            - id: gpt-5.6-terra
              reasoningEfforts: [low, medium, high]
            - id: gpt-5.6-luna
              reasoningEfforts: [low, medium, high]
          scope: cluster
          # Reasoning tokens count against this ceiling; higher efforts can exhaust
          # 1200 before a required function call is emitted.
          maxOutputTokens: 4096
          maxSteps: 5
          enabled: true
        - id: gemini-api-balanced
          displayName: Gemini API
          provider: gemini
          runtime: api
          modelEnvironmentVariable: GEMINI_MODEL
          credentialEnvironmentVariable: GEMINI_API_KEY
          availabilityEnvironmentVariable: GEMINI_PROFILE_AVAILABLE
          modelOptions:
            - id: gemini-3.8-flash
              reasoningEfforts: [low, medium, high]
          scope: cluster
          # Gemini reasoning tokens count against this ceiling; 1200 can be
          # exhausted before a required function call is emitted.
          maxOutputTokens: 4096
          maxSteps: 5
          enabled: true
        - id: claude-api-balanced
          displayName: Claude API
          provider: anthropic
          runtime: api
          modelEnvironmentVariable: ANTHROPIC_MODEL
          credentialEnvironmentVariable: ANTHROPIC_API_KEY
          availabilityEnvironmentVariable: ANTHROPIC_PROFILE_AVAILABLE
          modelOptions:
            - id: claude-haiku-5-5
              reasoningEfforts: [low, medium, high]
            - id: claude-sonnet-5-5
              reasoningEfforts: [low, medium, high]
            - id: claude-opus-5-5
              reasoningEfforts: [low, medium, high]
            - id: claude-fable-5-1
              reasoningEfforts: [low, medium, high]
          scope: cluster
          # Claude thinking cannot be turned off and counts against this ceiling.
          maxOutputTokens: 16000
          maxSteps: 5
          enabled: true
        - id: codex-subscription-local
          displayName: Codex / ChatGPT subscription
          provider: codex-cli
          runtime: cli
          model: gpt-5.6-luna
          modelOptions:
            - id: gpt-6.1-sol
              reasoningEfforts: [low, medium, high]
            - id: gpt-6.1-terra
              reasoningEfforts: [low, medium, high]
            - id: gpt-6-astra
              reasoningEfforts: [low, medium, high]
            - id: gpt-6-sol
              reasoningEfforts: [low, medium, high]
            - id: gpt-6-luna
              reasoningEfforts: [low, medium, high]
            - id: gpt-5.6-sol
              reasoningEfforts: [low, medium, high]
            - id: gpt-5.6-terra
              reasoningEfforts: [low, medium, high]
            - id: gpt-5.6-luna
              reasoningEfforts: [low, medium, high]
          availabilityEnvironmentVariable: CODEX_CLI_PROFILE_AVAILABLE
          supportedVersionPrefix: codex-cli 0.159.
          scope: local
          maxSteps: 3
          enabled: true
        - id: claude-subscription-local
          displayName: Claude subscription
          provider: claude-cli
          runtime: cli
          model: claude-sonnet-5-5
          modelOptions:
            - id: claude-haiku-5-5
              aliases: [haiku]
              reasoningEfforts: [low, medium, high]
            - id: claude-sonnet-5-5
              aliases: [sonnet]
              reasoningEfforts: [low, medium, high]
            - id: claude-opus-5-5
              aliases: [opus]
              reasoningEfforts: [low, medium, high]
            - id: claude-fable-5-2
              aliases: [fable]
              reasoningEfforts: [low, medium, high]
          scope: local
          supportedVersionPrefix: "2.1.325 "
          availabilityEnvironmentVariable: CLAUDE_CLI_PROFILE_AVAILABLE
          maxSteps: 3
          enabled: true
        - id: gemini-subscription-local
          displayName: Antigravity / Google subscription
          provider: antigravity-cli
          runtime: cli
          model: gemini-3.8-flash-medium
          modelOptions:
            - id: gemini-4-argon-low
            - id: gemini-4-argon-medium
            - id: gemini-4-argon-high
            - id: gemini-4-hydrogen-low
            - id: gemini-4-hydrogen-medium
            - id: gemini-4-hydrogen-high
            - id: gemini-4-hydrogen-xhigh
            - id: gemini-3.8-flash-low
            - id: gemini-3.8-flash-medium
            - id: gemini-3.8-flash-high
          availabilityEnvironmentVariable: GEMINI_CLI_PROFILE_AVAILABLE
          supportedVersionPrefix: 1.2.
          scope: local
          maxSteps: 3
          enabled: true
