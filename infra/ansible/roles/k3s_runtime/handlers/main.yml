---
- name: Reload guest firewall
  ansible.builtin.systemd_service:
    name: battlefield-k3s-firewall
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart managed K3s
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
